# Переводы темы «Дети и Kita». Вычитано по списку темы; слова, уже стоящие в 00-base.yaml, не дублируем.
# Правим три случая: словарь дал не то значение, которое нужно теме (Windel — не «пелёнка», а «подгузник»);
# формулировка словарная; перевода нет.
translations:
  # словарь даёт не то значение, которое нужно теме
  Windel:         подгузник
  Tagesmutter:    дневная мама, няня на дому
  streiten:       ссориться
  freuen:         радоваться
  bringen:        приводить, приносить
  entwickeln:     развивать, развиваться
  lieb:           милый, добрый
  Sorgerecht:     опека над ребёнком
  # значение то, но так не говорят
  Kinderwagen:    коляска
  Baby:           малыш, младенец
  # словарная выгрузка синонимов вместо одного-двух живых
  Kind:           ребёнок
  Freund:         друг
  Lehrer:         учитель
  Lehrerin:       учительница
  lachen:         смеяться
  anstrengend:    утомительный, тяжёлый
