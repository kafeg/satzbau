# Тема city — Город и ведомства.
# Проверены все слова темы, кроме тех, что уже стоят в 00-base.yaml.
translations:
  # словарь даёт не то значение, которое нужно теме
  Pass:           паспорт
  Laden:          магазин
  Rathaus:        мэрия, городская администрация
  Nachbarschaft:  окрестности, соседи
  Stadtplan:      карта города
  # немецкое учреждение или бумага: нужен понятный перевод, а не калька
  Ausweis:        удостоверение личности
  Aufenthalt:     пребывание в стране
  Konto:          счёт в банке
  nachweisen:     подтверждать документами
  abgeben:        сдавать, отдавать
  # перевод тот, но формулировка словарная
  Bargeld:        наличные
  finden:         находить
  suchen:         искать
  zeigen:         показывать
  öffnen:         открывать
  besuchen:       посещать
  sparen:         экономить, копить
  mitbringen:     приносить с собой
  beglaubigen:    заверять
  nah:            близкий
  # бытовая лексика A1, добавленная вторым заходом
  Geburtsland:       страна рождения
  Information:       информация
  Gemüsegeschäft:    овощной магазин
  Zebrastreifen:     пешеходный переход, зебра
  Wohngebiet:        жилой район
  Großstadt:         большой город
  Marktplatz:        рыночная площадь
  überqueren:        переходить, пересекать
