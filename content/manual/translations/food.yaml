# Тема «Еда». Конкретные предметы словарь переводит верно, поэтому правок мало:
# промахи тут не в значении, а в формулировке — выгрузка синонимов и книжные слова.
translations:
  # словарь даёт не то значение, которое нужно теме
  Markt:        рынок
  Backofen:     духовка
  Bäckerei:     булочная
  # формулировка словарная
  bezahlen:     платить, оплачивать
  probieren:    пробовать
  zubereiten:   готовить
  Zwiebel:      лук
  Zutat:        ингредиент
  Pfanne:       сковорода
