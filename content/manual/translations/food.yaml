# Тема «Еда». Конкретные предметы словарь переводит верно, поэтому правок мало:
# промахи тут не в значении, а в формулировке — выгрузка синонимов и книжные слова.
translations:
  # словарь даёт не то значение, которое нужно теме
  Markt:        рынок
  Backofen:     духовка
  Bäckerei:     булочная
  # формулировка словарная
  bezahlen:     платить, оплачивать
  probieren:    пробовать
  zubereiten:   готовить
  Zwiebel:      лук
  Zutat:        ингредиент
  Pfanne:       сковорода
  # бытовая лексика A1, добавленная вторым заходом
  Pfirsich:          персик
  Himbeere:          малина
  Rosine:            изюм
  Chip:              чипсина (мн. die Chips — чипсы)
  Cornflakes:        кукурузные хлопья
  Toastbrot:         хлеб для тостов
  Kochtopf:          кастрюля
  flüssig:           жидкий
  Einkaufstasche:    сумка для покупок
