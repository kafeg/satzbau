  Chefin:                начальница
  Kundin:                клиентка
  Mitarbeiterin:         сотрудница
  selbstständig:         самостоятельный, работающий на себя
  Überstunde:            переработка
  unbefristet:           бессрочный
  # формулировка словарная
  Arbeit:                работа
