  antworten:             отвечать
  unterschreiben:        подписывать
  Chef:                  начальник
  Brief:                 письмо
  müde:                  усталый
  freundlich:            приветливый, любезный
  zuverlässig:           надёжный
  Vertrag:               договор, контракт
  Kollegin:              коллега
  Gewerkschaft:          профсоюз
  Arbeitgeber:           работодатель
  Vorstellungsgespräch:  собеседование
  Gehaltserhöhung:       повышение зарплаты
  Dienstreise:           командировка
