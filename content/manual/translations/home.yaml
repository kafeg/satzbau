# Тема «Квартира». Вычитано по списку темы в themes.json; слова из 00-base.yaml не дублируются.
# Две причины правок: словарь дал не то значение, которое нужно теме (Wohnzimmer, putzen, Makler),
# и словарь выгрузил синонимы или канцелярит вместо перевода (klein, heizen, Mietvertrag).
translations:
  # не то значение: значение выбирает тема
  Wohnzimmer:       гостиная
  Makler:           риелтор
  putzen:           мыть, убирать
  aufräumen:        наводить порядок, убирать
  hängen:           висеть, вешать
  Besichtigung:     осмотр квартиры
  Mietvertrag:      договор аренды
  Hausordnung:      правила дома
  Kündigungsfrist:  срок расторжения договора
  Vermieterin:      арендодательница, хозяйка квартиры
  Wohnung:          квартира
  Keller:           подвал
  # перевод верный, но это выгрузка синонимов из словаря
  schön:            красивый
  Haus:             дом
  Bett:             кровать
  stellen:          ставить
  groß:             большой
  laut:             громкий, шумный
  Schlüssel:        ключ
  legen:            класть
  klein:            маленький
  wohnen:           жить
  kochen:           готовить
  reparieren:       чинить, ремонтировать
  umziehen:         переезжать
  hell:             светлый
  Sofa:             диван
  Lampe:            лампа
  lüften:           проветривать
  heizen:           отапливать
  geräumig:         просторный
