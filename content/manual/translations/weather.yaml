# Тема weather — Погода и время.
# Проверены все слова темы, кроме тех, что уже стоят в 00-base.yaml.
translations:
  # словарь даёт не то значение, которое нужно теме
  Sturm:        шторм, сильный ветер
  stürmisch:    штормовой, ветреный
  Hochwasser:   паводок, наводнение
  beginnen:     начинаться, начинать
  # перевод тот, но формулировка словарная
  Hitze:        жара
  Nebel:        туман
  frieren:      мёрзнуть
  aufstehen:    вставать
  vorhersagen:  прогнозировать, предсказывать
  rechtzeitig:  вовремя, своевременный
  # бытовая лексика A1, добавленная вторым заходом
  Blitz:             молния
  Frost:             мороз
  Unwetter:          непогода
