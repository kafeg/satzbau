# Переводы темы «Врач». Вычитано по списку темы; слова, уже стоящие в 00-base.yaml, не дублируем.
# Правим три случая: словарь дал не то значение, которое нужно теме (Spritze — не «шприц», а «укол»);
# формулировка словарная или грубая (Ärztin — «врачиха, докторша»); перевода нет.
translations:
  # словарь даёт не то значение, которое нужно теме
  Spritze:         укол, шприц
  Krankenkasse:    медицинская страховка
  Notaufnahme:     приёмный покой
  Physiotherapie:  физиотерапия, лечебная физкультура
  heilen:          заживать, вылечивать
  # значение то, но так не говорят
  Ärztin:          женщина-врач
  Blutdruck:       давление
  Medikament:      лекарство
  Sprechstunde:    приёмные часы
  Nebenwirkung:    побочный эффект
  Hand:            рука, кисть
  # словарная выгрузка синонимов вместо одного-двух живых
  Rezept:          рецепт
  schwach:         слабый
  ansteckend:      заразный
