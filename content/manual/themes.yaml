# Лексические темы — ручной отбор лемм.
# Это ЕДИНСТВЕННЫЙ источник лексикона: что не перечислено здесь, в сборку не попадёт.
# Частотность здесь не участвует, она только подсказывает порядок внутри темы.
#
# Поля слова:
#   w    лемма как в словаре, существительные с большой буквы, без артикля
#   pos  n существительное | v глагол | a прилагательное
#   lv   A1 | A2 | B1
#   tags для условий `need` в шаблонах; словарь тегов закрытый, см. README.md
#
# Порядок внутри темы = порядок показа новых слов.

