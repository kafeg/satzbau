# Ручные правки к собранным данным. Применяются после источников, перед записью JSON.
#
# Здесь ТОЛЬКО то, что нельзя вывести из данных. Многое, что казалось ручным,
# распознаётся само (`tools/check_lexicon.py` показывает, что именно):
#   pl_only           — в nouns.csv нет ни одной формы единственного числа
#   adj_decl          — есть колонки «<падеж> singular stark»
#   n-Deklination     — аккузатив единственного не равен лемме
#   род спорный       — род встретился разный в разных строках леммы (омонимы)
#   вариативное мн.ч. — заполнено несколько нумерованных колонок
# Распознать можно факт, но не решение. Решения — ниже.

# 1. Управление глаголов. В бандл идёт ТОЛЬКО то, что перечислено здесь.
#    Скобку `[with auf (+ accusative)]` автомат разбирает (91,5% всех скобок дампа),
#    но решить, что это управление уровня A1–B1, он не может: на срезе из восьми
#    автоматических пар верны пять. Предложения источников сборка кладёт в report.txt.
government:
  # подтверждено по срезу: это ровно те пары, которые нужны на A1–A2
  fahren:        ["mit D", "nach D"]
  warten:        ["auf A"]
  einsteigen:    ["in A"]
  umsteigen:     ["in A"]
  aussteigen:    ["aus D"]
  ankommen:      ["in D"]
  überweisen:    ["auf A"]
  anmelden:      ["bei D", "für A"]
  hängen:        ["an D"]
  kündigen:      ["D"]
  # из эталонного списка B1: слов ещё нет в темах, записи ждут своей темы
  sprechen:      ["mit D", "über A"]
  entschuldigen: ["für A", "bei D"]
  gehören:       ["zu D"]
  treffen:       ["mit D"]
  halten:        ["von D"]
  informieren:   ["über A"]

# 2. Омонимы: род у них разный по значению, и данные показывают оба.
#    Выбираем значение, нужное на A1–B1. Проверено по nouns.csv: спор виден у всех,
#    кроме Stock — у него род один, запись оставлена ради пояснения.
gender:
  Schild:  {g: n, note: "das Schild — табличка, вывеска; der Schild — щит"}
  Gehalt:  {g: n, note: "das Gehalt — зарплата; der Gehalt — содержание чего-либо"}
  Leiter:  {g: f, note: "die Leiter — стремянка; der Leiter — руководитель"}
  Steuer:  {g: f, note: "die Steuer — налог; das Steuer — руль"}
  Teil:    {g: n, note: "das Teil — деталь; der Teil — часть целого"}
  Band:    {g: n, note: "das Band — лента; die Band — группа; der Band — том книги"}
  Stock:   {g: m, note: "der Stock — этаж и палка"}
  Bus:     {g: m, note: "der Bus. В nouns.csv есть строка с genus 1=f — это мусор"}
  Flur:    {g: m, note: "der Flur — коридор в квартире; die Flur — поле, угодья"}
  Taxi:    {g: n, note: "das Taxi. der Taxi встречается регионально"}
  Quadratmeter: {g: m, note: "der Quadratmeter"}

# 3. Слова, у которых единственное число формально есть, но в речи они живут
#    во множественном. Данные их не отличают: у Möbel, Lebensmittel, Geschwister
#    в nouns.csv стоит род n. Решение педагогическое: не даём в задания на
#    артикль единственного числа.
plural_in_use:
  - Möbel
  - Lebensmittel
  - Geschwister

# 4. Субстантивированные прилагательные, которых нет в nouns.csv под этой леммой
#    (остальные распознаются по колонкам «stark»)
adj_declined_extra:
  - Beamter   # в данных лемма Beamter, не Beamte

# 5. Переводы. Здесь две разные вещи, и вторая оказалась больше первой.
#
#    а) перевода нет вообще — причастие в роли прилагательного словари держат при глаголе,
#       составные существительные часто не описаны. На срезе таких 5 из 198;
#    б) ⚠ перевод есть, но словарь даёт ПЕРВОЕ значение, а теме нужно другое:
#       Boden — «земля», а в квартире это «пол»; Ampel — «висячая лампа», а на улице
#       «светофор»; streichen — «бродить», а в ремонте «красить». Таких на срезе 33 из 198,
#       то есть каждое шестое слово. Это не брак источника: значение выбирает тема, а темы
#       словарь не знает. Автоматом не лечится — только руками, по одной строке на слово.
translations:
  # нет в источниках
  besetzt:        занято, несвободно
  möbliert:       с мебелью, меблированный
  renoviert:      после ремонта, отремонтированный
  Betriebskosten: эксплуатационные расходы
  Nachzahlung:    доплата, доначисление
  # словарь даёт не то значение, которое нужно теме
  Boden:          пол
  Stock:          этаж
  Strom:          электричество, ток
  Miete:          аренда, квартплата
  Flur:           коридор, прихожая
  Schalter:       касса, окно обслуживания
  Herd:           плита
  Regal:          полка, стеллаж
  Ampel:          светофор
  Kreuzung:       перекрёсток
  Gleis:          путь, платформа
  Anmeldung:      регистрация по месту жительства
  Mülltonne:      мусорный бак
  Umleitung:      объезд
  Ermäßigung:     скидка
  Erstattung:     возврат денег
  Kaution:        залог за квартиру
  Fahrt:          поездка
  Hausmeister:    комендант дома
  Vermieter:      арендодатель, хозяин квартиры
  Nebenkosten:    коммунальные расходы
  Verbindung:     рейс, стыковка
  Durchsage:      объявление по громкой связи
  Anschluss:      стыковка, подключение
  fahren:         ехать, ездить
  laufen:         идти пешком, бежать
  erreichen:      успеть на, достигать
  streichen:      красить
  buchen:         бронировать
  abbiegen:       поворачивать
  anmelden:       регистрировать, прописывать
  renovieren:     делать ремонт
  entfallen:      отменяться
  entwerten:      компостировать билет
  sanieren:       капитально ремонтировать
  überweisen:     переводить деньги
  parken:         парковаться
  tanken:         заправляться
  kündigen:       расторгать договор
  setzen:         ставить, sich setzen — садиться
  ruhig:          тихий, спокойный
  günstig:        выгодный, недорогой
  billig:         дешёвый, недорогой
  barrierefrei:   без ступеней, доступный
  hellhörig:      с тонкими стенами, слышно соседей

# 6. Глаголы, у которых источник даёт и haben, и sein.
#    `use` — вспомогательный для того значения, которое тренируем (de-DE);
#    без `use` глагол остаётся спорным и в задания на выбор haben/sein не попадает.
#    `note` показывается в разборе: второе значение существует, и человек его встретит.
aux_ambiguous:
  fahren:   {use: s, note: "ist gefahren — поехал; hat gefahren — вёл машину сам"}
  fliegen:  {use: s, note: "ist geflogen — полетел; hat geflogen — пилотировал"}
  abfahren: {use: s, note: "ist abgefahren — отправился; hat abgefahren — объездил, стёр"}
  abbiegen: {use: s, note: "ist abgebogen — повернул; hat abgebogen — отогнул"}
  umziehen: {use: s, note: "ist umgezogen — переехал; hat sich umgezogen — переоделся"}
  stehen:   {use: h, note: "hat gestanden. ist gestanden — юг Германии и Австрия"}
  liegen:   {use: h, note: "hat gelegen. ist gelegen — юг Германии и Австрия"}
  sitzen:   {use: h, note: "hat gesessen. ist gesessen — юг Германии и Австрия"}
  hängen:   {use: h, note: "hat gehangen — висело; hat gehängt — повесил, это слабый глагол"}
  setzen:   {use: h, note: "hat sich gesetzt — сел; сидел — это sitzen, hat gesessen"}
