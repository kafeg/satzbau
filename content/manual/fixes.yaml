# Ручные правки к собранным данным. Применяются после источников, перед записью JSON.
#
# Здесь ТОЛЬКО то, что нельзя вывести из данных. Многое, что казалось ручным,
# распознаётся само (`tools/check_lexicon.py` показывает, что именно):
#   pl_only           — в nouns.csv нет ни одной формы единственного числа
#   adj_decl          — есть колонки «<падеж> singular stark»
#   n-Deklination     — аккузатив единственного не равен лемме
#   род спорный       — род встретился разный в разных строках леммы (омонимы)
#   вариативное мн.ч. — заполнено несколько нумерованных колонок
# Распознать можно факт, но не решение. Решения — ниже.

# 1. Управление глаголов. В бандл идёт ТОЛЬКО то, что перечислено здесь.
#    Скобку `[with auf (+ accusative)]` автомат разбирает (91,5% всех скобок дампа),
#    но решить, что это управление уровня A1–B1, он не может: на срезе из восьми
#    автоматических пар верны пять. Предложения источников сборка кладёт в report.txt.
government:
  # подтверждено по срезу: это ровно те пары, которые нужны на A1–A2
  fahren:        ["mit D", "nach D"]
  warten:        ["auf A"]
  einsteigen:    ["in A"]
  umsteigen:     ["in A"]
  aussteigen:    ["aus D"]
  ankommen:      ["in D"]
  überweisen:    ["auf A"]
  anmelden:      ["bei D", "für A"]
  hängen:        ["an D"]
  kündigen:      ["D"]
  anfangen:      ["mit D"]
  aufhören:      ["mit D"]
  antworten:     ["auf A"]
  arbeiten:      ["an D"]
  aufpassen:     ["auf A"]
  bewerben:      ["bei D", "um A"]
  bezahlen:      ["für A"]
  einreichen:    ["bei D"]
  helfen:        ["bei D", "D"]
  impfen:        ["gegen A"]
  leiden:        ["an D"]
  spielen:       ["mit D"]
  streiten:      ["mit D", "um A"]
  telefonieren:  ["mit D"]
  verzichten:    ["auf A"]
  verschieben:   ["auf A"]
  verdienen:     ["an D"]
  basteln:       ["an D"]
  # из эталонного списка B1: слов ещё нет в темах, записи ждут своей темы
  sprechen:      ["mit D", "über A"]
  entschuldigen: ["für A", "bei D"]
  gehören:       ["zu D"]
  treffen:       ["mit D"]
  informieren:   ["über A"]

# 1a. Пример дополнения к управлению. Нужен там, где пропуск — сам предлог: фраза
#     «Ich warte … den Zug» без дополнения не собирается, а подбирать дополнение
#     автоматом уже пробовали — выходило «Er würzt das Salz» (отвергнуто,
#     docs/architecture.md). Здесь оно написано руками, с артиклем в том падеже,
#     который требует управление, и каждую строку видно глазами.
#     Пример — это весь хвост фразы, вместе с прямым дополнением, если глагол его
#     требует: «das Geld auf das Konto». Предлог генератор находит сам, по управлению
#     этого же глагола, и делит пример на «до предлога» и «после».
#     Два предлога — список из двух примеров, по одному на предлог: у anmelden и
#     fahren предлог выбирает смысл, и без примера верных ответов было бы два.
#     Возвратное sich в пример не пишем: его ставит рамка.
#     Проверяет валидатор: предлог примера есть в управлении, примеров не больше, чем
#     предложных связок, и глагол с предлогом без примера попадает в заметки.
government_example:
  anfangen:     "mit der Arbeit"
  ankommen:     "in Berlin"
  antworten:    "auf die E-Mail"
  arbeiten:     "an einem Projekt"
  aufhören:     "mit der Arbeit"
  aufpassen:    "auf das Kind"
  aussteigen:   "aus dem Bus"
  basteln:      "an einem Bild"
  bezahlen:     "für das Essen"
  einsteigen:   "in den Zug"
  helfen:       "bei der Arbeit"
  impfen:       "gegen die Grippe"
  leiden:       "an einer Allergie"
  spielen:      "mit dem Ball"
  telefonieren: "mit dem Chef"
  umsteigen:    "in die S-Bahn"
  verdienen:    "an einem Auftrag"
  verzichten:   "auf den Nachtisch"
  warten:       "auf den Zug"
  # глаголу нужно ещё и прямое дополнение: оно в примере перед предлогом
  einreichen:   "den Antrag bei der Firma"
  überweisen:   "das Geld auf das Konto"
  verschieben:  "den Termin auf Montag"
  # подлежащее не человек: «Ich hänge an der Wand» про себя. Рамка даёт «Das hängt …»
  hängen:       "an der Wand"
  # два предлога: порядок примеров — порядок предлогов в задании
  anmelden:     ["das Kind bei der Stadt", "das Kind für den Kurs"]
  bewerben:     ["bei der Firma", "um die Stelle"]
  fahren:       ["mit dem Bus", "nach Berlin"]
  streiten:     ["mit dem Nachbarn", "um den Platz"]

# 2. Род: решения, которых нет в данных. Два случая.
#
#    а) омонимы: род разный по значению, и данные показывают оба. Выбираем значение,
#       нужное на A1–B1 (`das Schild` — табличка, а не щит);
#    б) составные существительные, которых в nouns.csv нет вовсе: без рода слово
#       в сборку не попадает, и это видно в report.txt как «нет рода».
gender:
  # а) омонимы
  Schild:  {g: n, note: "das Schild — табличка, вывеска; der Schild — щит"}
  Gehalt:  {g: n, note: "das Gehalt — зарплата; der Gehalt — содержание чего-либо"}
  Leiter:  {g: f, note: "die Leiter — стремянка; der Leiter — руководитель"}
  Steuer:  {g: f, note: "die Steuer — налог; das Steuer — руль"}
  Teil:    {g: n, note: "das Teil — деталь; der Teil — часть целого"}
  Band:    {g: n, note: "das Band — лента; die Band — группа; der Band — том книги"}
  Kunde:   {g: m, note: "der Kunde — клиент; die Kunde — весть"}
  Messer:  {g: n, note: "das Messer — нож; der Messer — тот, кто измеряет"}
  Reis:    {g: m, note: "der Reis — рис; das Reis — побег, ветка"}
  Pfand:   {g: n, note: "das Pfand — залог за тару"}
  Stock:   {g: m, note: "der Stock — этаж и палка"}
  Bus:     {g: m, note: "der Bus. В nouns.csv есть строка с genus 1=f — это мусор"}
  Flur:    {g: m, note: "der Flur — коридор в квартире; die Flur — поле, угодья"}
  Taxi:    {g: n, note: "das Taxi. der Taxi встречается регионально"}
  Quadratmeter: {g: m, note: "der Quadratmeter"}
  Butter:  {g: f, note: "die Butter. Регионально встречается der и das"}
  Kaffee:  {g: m, note: "der Kaffee"}
  Tee:     {g: m, note: "der Tee"}
  Teller:  {g: m, note: "der Teller"}
  Zwiebel: {g: f, note: "die Zwiebel"}
  Husten:  {g: m, note: "der Husten"}
  Mund:    {g: m, note: "der Mund"}
  # б) составных слов нет в nouns.csv — без этого в сборку не попадут
  Fortbildung: {g: f}
  Trotzphase:  {g: f}

# 2б. Существительные без множественного числа — это решение, а не пропуск в данных.
#     Иначе сборка каждый раз сообщает «нет множественного» про Hunger и Obst.
no_plural:
  - Hunger
  - Durst
  - Obst
  - Fleisch
  - Vollzeit
  - Teilzeit
  - Elterngeld
  - Kindergeld
  - Mittagsschlaf
  - Sorgerecht

# 2в. Неисчисляемые: с неопределённым артиклем не употребляются. Без этого решения
#      шаблон «Ich brauche …» выдаёт «ein Benzin» и «einen Schimmel».
#      Напитки сюда НЕ входят: «ein Kaffee, bitte» — нормальная фраза.
mass:
  - Benzin
  - Strom
  - Schimmel
  - Blut
  - Geld
  - Fleisch
  - Obst
  - Gemüse
  - Reis
  - Salz
  - Zucker
  - Butter
  - Schokolade
  - Hunger
  - Durst
  - Fieber
  - Husten
  - Schnupfen
  # «Ich esse einen Käse» и «ich trinke eine Milch» — так не говорят
  - Käse
  - Milch

# 3. Слова, у которых единственное число формально есть, но в речи они живут
#    во множественном. Данные их не отличают: у Möbel, Lebensmittel, Geschwister
#    в nouns.csv стоит род n. Решение педагогическое: не даём в задания на
#    артикль единственного числа.
# Глаголы, которые в тренируемом значении живут только с sich: «sich bewerben».
# Без пометки рамка без sich даёт неграмматичное «Er bewirbt oft».
reflexive:
  - bewerben

plural_in_use:
  - Möbel
  - Lebensmittel
  - Geschwister
  # боль и жалобы считают во множественном: «Ich habe Schmerzen», не «einen Schmerz»
  - Schmerz
  - Beschwerde

# 4. Субстантивированные прилагательные, которых нет в nouns.csv под этой леммой
#    (остальные распознаются по колонкам «stark»)
adj_declined_extra:
  - Beamter   # в данных лемма Beamter, не Beamte

# 5. Переводы. Здесь две разные вещи, и вторая оказалась больше первой.
#
#    а) перевода нет вообще — причастие в роли прилагательного словари держат при глаголе,
#       составные существительные часто не описаны. На срезе таких 5 из 198;
#    б) ⚠ перевод есть, но словарь даёт ПЕРВОЕ значение, а теме нужно другое:
#       Boden — «земля», а в квартире это «пол»; Ampel — «висячая лампа», а на улице
#       «светофор»; streichen — «бродить», а в ремонте «красить». Таких на срезе 33 из 198,
#       то есть каждое шестое слово. Это не брак источника: значение выбирает тема, а темы
