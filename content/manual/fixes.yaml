# 3. Слова, у которых единственное число формально есть, но в речи они живут
#    во множественном. Данные их не отличают: у Möbel, Lebensmittel, Geschwister
#    в nouns.csv стоит род n. Решение педагогическое: не даём в задания на
#    артикль единственного числа.
# Глаголы, которые в тренируемом значении живут только с sich: «sich bewerben».
# Без пометки рамка без sich даёт неграмматичное «Er bewirbt oft».
reflexive:
  # только с sich: «Er freut oft» — не немецкий язык. Флаг говорит «ОБЯЗАТЕЛЬНО
  # возвратный», поэтому anmelden и fühlen сюда не идут: они бывают и без sich
  - bewerben
  - freuen
  - beeilen
  - ausruhen
  - entschuldigen
  - verspäten
  - schämen
  - beschweren
  - einigen
  - rasieren
  - kämmen
  - schminken
  - abschminken
  - anschnallen

# 2b. Множественное руками. Нужно там, где источник даёт форму ДРУГОГО значения
#     омонима: die Bank — банк даёт Banken, а скамья Bänke, и в заданиях появлялись
#     скамейки. Главнее источника; спорить с no_plural нельзя, это ловит валидатор.
plural:
  # ⚠ Омонимы: род мы выбрали руками, а множественное в той же строке источника —
  # от ДРУГОГО слова. Сборка теперь сама требует здесь строку, когда ручной род
  # не совпал с родом источника (`report.txt`).
  Bank: Banken          # банк, не скамья (Bänke)
  Leiter: Leitern       # стремянка, не руководитель (Leiter)
  Steuer: Steuern       # налог, не руль (Steuer)
  Gehalt: Gehälter      # зарплата, не содержание чего-либо (Gehalte)
  # ⚠ Источник даёт несуществующие формы. Найдено сверкой склонения с UniMorph:
  # до неё они жили в заданиях — «Hier sind zwei Menscher», «zwei Gasten».
  Mensch: Menschen
  Gast: Gäste
  Feld: Felder
  Landsmann: Landsleute
  # множественного у этих нет, но строка нужна, чтобы сборка не ругалась на омоним
  Achtel: Achtel
  Hundertstel: Hundertstel
  Viertel: Viertel
  Virus: Viren
  Foto: Fotos
  Trikot: Trikots
  Stift: Stifte         # ручка-карандаш; «Stifter» это основатель
  Bruch: Brüche

plural_in_use:
  - Möbel
  - Lebensmittel
  - Geschwister
  # боль и жалобы считают во множественном: «Ich habe Schmerzen», не «einen Schmerz»
  - Schmerz
  - Beschwerde

# 4. Субстантивированные прилагательные, которых нет в nouns.csv под этой леммой
#    (остальные распознаются по колонкам «stark»)
adj_declined_extra:
  - Beamter   # в данных лемма Beamter, не Beamte

# 5. Переводы. Здесь две разные вещи, и вторая оказалась больше первой.
#
#    а) перевода нет вообще — причастие в роли прилагательного словари держат при глаголе,
#       составные существительные часто не описаны. На срезе таких 5 из 198;
#    б) ⚠ перевод есть, но словарь даёт ПЕРВОЕ значение, а теме нужно другое:
#       Boden — «земля», а в квартире это «пол»; Ampel — «висячая лампа», а на улице
#       «светофор»; streichen — «бродить», а в ремонте «красить». Таких на срезе 33 из 198,
#       то есть каждое шестое слово. Это не брак источника: значение выбирает тема, а темы
#       словарь не знает. Автоматом не лечится — только руками, по одной строке на слово.
