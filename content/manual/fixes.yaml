# 3. Слова, у которых единственное число формально есть, но в речи они живут
#    во множественном. Данные их не отличают: у Möbel, Lebensmittel, Geschwister
#    в nouns.csv стоит род n. Решение педагогическое: не даём в задания на
#    артикль единственного числа.
# Глаголы, которые в тренируемом значении живут только с sich: «sich bewerben».
# Без пометки рамка без sich даёт неграмматичное «Er bewirbt oft».
reflexive:
  # только с sich: «Er freut oft» — не немецкий язык. Флаг говорит «ОБЯЗАТЕЛЬНО
  # возвратный», поэтому anmelden и fühlen сюда не идут: они бывают и без sich
  - bewerben
  - freuen
  - beeilen
  - ausruhen
  - entschuldigen
  - verspäten
  - schämen
  - beschweren
  - einigen
  - rasieren
  - kämmen
  - schminken
  - abschminken
  - anschnallen

# 2b. Множественное руками. Нужно там, где источник даёт форму ДРУГОГО значения
#     омонима: die Bank — банк даёт Banken, а скамья Bänke, и в заданиях появлялись
#     скамейки. Главнее источника; спорить с no_plural нельзя, это ловит валидатор.
plural:
  # ⚠ Омонимы: род мы выбрали руками, а множественное в той же строке источника —
  # от ДРУГОГО слова. Сборка теперь сама требует здесь строку, когда ручной род
  # не совпал с родом источника (`report.txt`).
  Bank: Banken          # банк, не скамья (Bänke)
  Leiter: Leitern       # стремянка, не руководитель (Leiter)
  Steuer: Steuern       # налог, не руль (Steuer)
  Gehalt: Gehälter      # зарплата, не содержание чего-либо (Gehalte)
  # ⚠ Источник даёт несуществующие формы. Найдено сверкой склонения с UniMorph:
  # до неё они жили в заданиях — «Hier sind zwei Menscher», «zwei Gasten».
  Mensch: Menschen
  Gast: Gäste
  Feld: Felder
  Landsmann: Landsleute
  # множественного у этих нет, но строка нужна, чтобы сборка не ругалась на омоним
  Achtel: Achtel
  Hundertstel: Hundertstel
  Viertel: Viertel
  Virus: Viren
  Foto: Fotos
  Trikot: Trikots
  Stift: Stifte         # ручка-карандаш; «Stifter» это основатель
  Bruch: Brüche

# Слова, у которых ПРИНЯТЫ два рода: «der Laptop» и «das Laptop», «der Meter»
# и «das Meter». Таким словам нечего делать в задании «der, die или das»: ответ там
# один по построению, и верный выбор получал бы минус. Из задания они убраны (`not: g2`),
# в остальных рамках живут с родом, выбранным выше, — он основной.
# ⚠ Поле `g_alt` источника для этого не годится: там же рядом стоят диалектные
# и чужие значения (Eimer m/f, Hase m/f, Kiste f/m), а спорных там 57 вместо этих.
gender_also:
  Laptop:       n     # der Laptop (осн.) и das Laptop
  Podcast:      n
  Haarspray:    n
  Ersatzteil:   m
  Spam:         m
  Yoga:         n
  Radio:        m     # das в Германии, der в Австрии и Швейцарии
  Kredit:       n     # das Kredit — австрийский стандарт
  Drittel:      m
  # ⚠ Меры спорят всей семьёй, по одному их брать нельзя: Zentimeter, Quadratmeter
  # и Kubikmeter остались снаружи, когда список писался по памяти, а не по лексикону
  Meter:        n
  Zentimeter:   n
  Millimeter:   n
  Kilometer:    n
  Quadratmeter: n
  Kubikmeter:   n
  Liter:        n
  Hektar:       m
  Kilo:         m
  Zehntel:      m     # та же семья долей, что Drittel и Achtel: das (осн.), der в Швейцарии
  Puder:        n     # der Puder (осн.), das Puder
  Spachtel:     f     # der Spachtel (инструмент), die Spachtel
  Vokabel:      n     # die Vokabel (осн.), das Vokabel в Австрии

# Источник спорит о роде, а род один: редкое значение, диалект или чужая часть речи
# в той же строке. Проверено по одному; список нужен, чтобы сборка не спрашивала о них
# заново и чтобы было видно, что их СМОТРЕЛИ, а не пропустили.
gender_single:
  - Alter        # das Alter — возраст; «der Alte» это другое слово
  - Boot
  - Eimer
  - Euro
  - Grad
  - Haar
  - Hantel
  - Hase
  - Kiste
  - Kompromiss
  - Laden
  - Latte
  - Loch
  - Luft
  - Matte
  - Mittag
  - Mode
  - Monat
  - Morgen       # der Morgen — утро; «das Morgen» это книжное «завтра»
  - Nebel
  - Neffe
  - Quadrat
  - Rohr
  - Rolle
  - Sieg
  - Staffel
  - Tag
  - Wetter
  - Wolf
  - Zelt
  - Zoll         # der Zoll и о пошлине, и о дюйме

# Второе принятое множественное. Показываем одно, засчитываем оба: заимствования
# на -on/-üm/-a держат и немецкое, и исходное окончание, и обе формы в словаре.
# ⚠ Списком из источника это не берётся: там же лежат множественные чужого омонима
# (Schal → «Schale» это миска, Stift → «Stifter» это основатель) и диалектные
# («Kinderwägen», «Rettungswägen»). Поэтому строки руками, по одной на слово.
plural_also:
  Ski:        [Skier]
  Parfüm:     [Parfüme]
  Karton:     [Kartone]
  Balkon:     [Balkone]
  Deodorant:  [Deodorante]
  Sauna:      [Saunas]
  Visum:      [Visen]
  Schal:      [Schale]      # Duden: -s, реже -e; «die Schale» (миска) — другое слово
  Tank:       [Tanke]       # Duden: -s, также -e

# Второе принятое причастие. У senden и wenden форма зависит от значения
# («Nachricht gesendet», но «Brief gesandt»), и обе верны в заданиях на Perfekt.
participle_also:
  senden:     [gesandt]
  versenden:  [versendet]
  wiegen:     [gewiegt]

plural_in_use:
  - Möbel
  - Lebensmittel
  - Geschwister
  # боль и жалобы считают во множественном: «Ich habe Schmerzen», не «einen Schmerz»
  - Schmerz
