# Отделяемые глаголы: до сих пор они были исключены из всех глагольных рамок,
# потому что приставка уезжает в конец и ломает фразу. Здесь она уезжает нарочно:
# пропуск — спрягаемая часть, приставка стоит в конце как {particle}.
# Условие «solo И отделяемый» выражено через has: [sep] — tags это «любой из».
- id: trennbar-heute
  rule: praesens-trennbar
  level: A1
  kind: input
  frame: "Ich {slot} heute {particle}."
  need: {pos: v, tags: [solo], has: [sep], not: [reflexive]}
  slot: {paradigm: verb_stem, person: 1sg}
  why: praesens-trennbar

- id: possessiv-akk-suchen
