# Шаблоны заданий. Задание = шаблон × слово из лексикона; сами задания не хранятся.
#
# ЕДИНАЯ ФОРМА для всех типов: фраза с одним пропуском. Так валидатор и оценка
# устроены одинаково, а разнообразие даёт не форма задания, а правило в пропуске.
#
# Поля:
#   id       уникальный
#   rule     единица повтора и ключ в explain.yaml
#   level    A1 | A2 | B1
#   kind     choice (выбрать из вариантов) | input (ввести форму)
#   frame    фраза; {slot} — пропуск, {w} — слово, {W} — слово с большой буквы
#   need     условие на наполнение: pos, theme, tags (ЛЮБОЙ из перечисленных), lv_max, has, not
#   slot     что стоит в пропуске: парадигма + её параметры
#   options  только для kind: choice — из какой парадигмы берутся варианты и сколько их
#   why      ключ объяснения
#
# Варианты ответа берутся из ИНВЕНТАРЯ ФОРМ парадигмы, а не «то же слово в других падежах»:
# иначе для женского рода набор вырождается (Nom die, Akk die, Dat der, Gen der — два дубля).
#
# ⚠ count не может быть больше инвентаря. У aux_present в первом лице это ровно две формы,
# habe и bin: просить четыре — значит добить набор формами других лиц (hat, ist), а это
# проверка лица, а не выбора вспомогательного. Поэтому у двух шаблонов Perfekt count: 2.
# У merge-wo-in оставлено 4, но это ТРЕБОВАНИЕ К ЯДРУ: склеенных форм с предлогом in
# всего две (im, ins), и чтобы вариантов было четыре, инвентарь парадигмы должен включать
# несклеенные in dem / in das. Это и есть полезный дистрактор: «надо было склеить».

- id: prep-dat-mit
  rule: prep-dativ
  level: A1
  kind: choice
  frame: "Ich fahre mit {slot} {w}."
  need: {pos: n, theme: transport, tags: [vehicle], not: [pl_only]}
  slot: {paradigm: def_article, case: dat, num: sg, prep: mit}
  options: {paradigm: def_article, count: 4}
  why: prep-dativ

# Было записано как prep-akkusativ, но предлога во фразе нет: падеж здесь требует
# глагол, а не предлог. Это отдельное правило, и объяснение у него своё.
- id: akk-objekt-brauchen
  rule: akkusativ-objekt
  level: A1
  kind: choice
  frame: "Ich brauche {slot} {w}."
  need: {pos: n, tags: [document, thing], not: [pl_only, plu, mass]}
  slot: {paradigm: indef_article, case: akk, num: sg}
  options: {paradigm: indef_article, count: 4}
  why: akkusativ-objekt

- id: prep-akk-fuer
  rule: prep-akkusativ
  level: A1
  kind: choice
  frame: "Das Geschenk ist für {slot} {w}."
  need: {pos: n, tags: [person], not: [pl_only, plu]}
  slot: {paradigm: def_article, case: akk, num: sg, prep: für}
  options: {paradigm: def_article, count: 4}
  why: prep-akkusativ

# Предлог здесь auf, а не in, и это не вкус: «in dem Zimmer» грамматически верно,
# но по-немецки так не говорят — обязательно «im». Нельзя тренировать падеж на форме,
# которую носитель не употребляет. auf с артиклем не сливается, и обе фразы живые.
- id: wechsel-wo-auf
  rule: wechsel-wo
  level: A2
  kind: choice
  frame: "Die Lampe steht auf {slot} {w}."
  need: {pos: n, tags: [surface], not: [pl_only]}
  slot: {paradigm: def_article, case: dat, num: sg, prep: auf}
  options: {paradigm: def_article, count: 4}
  why: wechsel-wo

- id: wechsel-wohin-auf
  rule: wechsel-wohin
  level: A2
  kind: choice
  frame: "Ich stelle die Lampe auf {slot} {w}."
  need: {pos: n, tags: [surface], not: [pl_only]}
  slot: {paradigm: def_article, case: akk, num: sg, prep: auf}
  options: {paradigm: def_article, count: 4}
  why: wechsel-wohin

- id: merge-wo-in
  rule: merge-prep-article
  level: A2
  kind: choice
  frame: "Wir sind {slot} {w}."
  need: {pos: n, tags: [room], g: [m, n], not: [pl_only]}
  slot: {paradigm: merged_prep_article, prep: in, case: dat, num: sg}
  options: {paradigm: merged_prep_article, prep: in, count: 4}
  why: merge-prep-article

# Второй шаблон на то же правило, и снова не для красоты: с одним шаблоном ответ
# «im» верен на всём наполнении, и человек отвечает не глядя. Пара wo/wohin даёт
# im против ins — то есть собственно Wechselpräposition.
- id: merge-wohin-in
  rule: merge-prep-article
  level: A2
  kind: choice
  frame: "Wir gehen {slot} {w}."
  need: {pos: n, tags: [room], g: [n], not: [pl_only]}
  slot: {paradigm: merged_prep_article, prep: in, case: akk, num: sg}
  options: {paradigm: merged_prep_article, prep: in, count: 4}
  why: merge-prep-article

- id: adj-dat-en-klein
  rule: adj-dat-en
  level: A2
  kind: input
  frame: "Wir wohnen in einer klein{slot} {w}."
  need: {pos: n, theme: home, tags: [place, room], g: [f], not: [pl_only]}
  slot: {paradigm: adj_ending, decl: mixed, case: dat, num: sg, gender: from_word}
  why: adj-dat-en

# Два шаблона на одно правило, и это не дубль. Глагол в задании виден (он стоит в {pp}),
# так что «подсказка по рамке» — не проблема; проблема в наборе ответов внутри ПРАВИЛА.
# Замерено: глаголов движения с однозначным aux — 13, из них sein 12. На одном шаблоне
# человек отвечает `bin` не глядя на глагол и прав в 12 случаях из 13. Второй шаблон
# добавляет 16 глаголов, все на haben: по правилу выходит 12 sein против 17 haben,
# и ответ без чтения глагола не угадать. Баланс нужен на уровне правила, не шаблона.
- id: perfekt-aux-motion
  rule: perfekt-aux
  level: A1
  kind: choice
  frame: "Ich {slot} gestern {pp}."
  need: {pos: v, tags: [motion], not: [aux_hs, obj]}
  slot: {paradigm: aux_present, person: 1sg, from_word: aux}
  options: {paradigm: aux_present, count: 2}
  why: perfekt-aux

- id: perfekt-aux-action
  rule: perfekt-aux
  level: A1
  kind: choice
  frame: "Ich {slot} die Wohnung {pp}."
  need: {pos: v, tags: [housework], not: [aux_hs]}
  slot: {paradigm: aux_present, person: 1sg, from_word: aux}
  options: {paradigm: aux_present, count: 2}
  why: perfekt-aux
