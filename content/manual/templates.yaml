  why: adj-gemischt

# ── Род: три кнопки. Единственное задание, где оценивается СЛОВО, а не правило на нём.
# ⚠ Бейдж рода у слова в дрилле здесь прячется: иначе ответ написан на экране.
- id: genus-das-ist
  rule: genus
  level: A1
  kind: choice
  frame: "Das ist {slot} {w}."
  need: {pos: n, not: [pl_only, plu, noart]}
  slot: {paradigm: def_article, case: nom, num: sg, gender: from_word}
  options: {paradigm: genus, count: 3}
  why: genus

# Безличные глаголы погоды: подлежащее у них только es. Ни solo, ни obj им не подходят
# («Er regnet oft», «Er regnet das heute»), поэтому до тега weather их не брала ни одна
