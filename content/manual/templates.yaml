# Шаблоны заданий. Задание = шаблон × слово из лексикона; сами задания не хранятся.
#
# ЕДИНАЯ ФОРМА для всех типов: фраза с одним пропуском. Так валидатор и оценка
# устроены одинаково, а разнообразие даёт не форма задания, а правило в пропуске.
#
# Поля:
#   id       уникальный
#   rule     единица повтора и ключ в explain.yaml
#   level    A1 | A2 | B1
#   kind     choice (выбрать из вариантов) | input (ввести форму)
#   frame    фраза; {slot} — пропуск, {w} — слово, {W} — слово с большой буквы
#   need     условие на наполнение: pos, theme, tags (все перечисленные), lv_max, has, not
#   slot     что стоит в пропуске: парадигма + её параметры
#   options  только для kind: choice — из какой парадигмы берутся варианты и сколько их
#   why      ключ объяснения
#
# Варианты ответа берутся из ИНВЕНТАРЯ ФОРМ парадигмы, а не «то же слово в других падежах»:
# иначе для женского рода набор вырождается (Nom die, Akk die, Dat der, Gen der — два дубля).

- id: prep-dat-mit
  rule: prep-dativ
  level: A1
  kind: choice
  frame: "Ich fahre mit {slot} {w}."
  need: {pos: n, theme: transport, tags: [vehicle], not: [pl_only]}
  slot: {paradigm: def_article, case: dat, num: sg}
  options: {paradigm: def_article, count: 4}
  why: prep-dativ

- id: prep-akk-fuer
  rule: prep-akkusativ
  level: A1
  kind: choice
  frame: "Ich brauche {slot} {w}."
  need: {pos: n, tags: [document, thing], not: [pl_only]}
  slot: {paradigm: indef_article, case: akk, num: sg}
  options: {paradigm: indef_article, count: 4}
  why: prep-akkusativ

- id: wechsel-wo-in
  rule: wechsel-wo
  level: A2
  kind: choice
  frame: "Die Lampe steht in {slot} {w}."
  need: {pos: n, theme: home, tags: [room], not: [pl_only]}
  slot: {paradigm: def_article, case: dat, num: sg}
  options: {paradigm: def_article, count: 4}
  why: wechsel-wo

- id: wechsel-wohin-in
  rule: wechsel-wohin
  level: A2
  kind: choice
  frame: "Ich stelle die Lampe in {slot} {w}."
  need: {pos: n, theme: home, tags: [room], not: [pl_only]}
  slot: {paradigm: def_article, case: akk, num: sg}
  options: {paradigm: def_article, count: 4}
  why: wechsel-wohin

- id: merge-wo-in
  rule: merge-prep-article
  level: A2
  kind: choice
  frame: "Wir sind {slot} {w}."
  need: {pos: n, theme: home, tags: [room], g: [m, n], not: [pl_only]}
  slot: {paradigm: merged_prep_article, prep: in, case: dat, num: sg}
  options: {paradigm: merged_prep_article, prep: in, count: 4}
  why: merge-prep-article

- id: adj-dat-en-klein
  rule: adj-dat-en
  level: A2
  kind: input
  frame: "Wir wohnen in einer klein{slot} {w}."
  need: {pos: n, theme: home, tags: [place, room], g: [f], not: [pl_only]}
  slot: {paradigm: adj_ending, decl: mixed, case: dat, num: sg, gender: from_word}
  why: adj-dat-en

# Два шаблона на одно правило, и это не дубль: на глаголах движения ответ почти
# всегда `bin`, на остальных — `habe`. С одним шаблоном ответ угадывается по рамке,
# и правило не тренируется. Проверено на данных: среди глаголов с тегом motion
# и однозначным aux семь требуют sein и только один haben.
- id: perfekt-aux-motion
  rule: perfekt-aux
  level: A1
  kind: choice
  frame: "Ich {slot} nach Berlin {pp}."
  need: {pos: v, tags: [motion], not: [aux_hs]}
  slot: {paradigm: aux_present, person: 1sg, from_word: aux}
  options: {paradigm: aux_present, count: 4}
  why: perfekt-aux

- id: perfekt-aux-action
  rule: perfekt-aux
  level: A1
  kind: choice
  frame: "Ich {slot} die Wohnung {pp}."
  need: {pos: v, theme: home, tags: [state], not: [aux_hs]}
  slot: {paradigm: aux_present, person: 1sg, from_word: aux}
  options: {paradigm: aux_present, count: 4}
  why: perfekt-aux
