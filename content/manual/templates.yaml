# Без артикля прилагательное берёт его окончание на себя — сильное склонение.
# Существительное первым, прилагательное вторым, оба из темы Еда: там без артикля
# говорят чаще всего («Ich mag frischen Fisch»).
- id: adj-stark-gut
  rule: adj-ohne-artikel
  level: A2
  kind: input
  # ⚠ Без артикля стоят только неисчисляемые: «Ich kaufe frische Banane» — ошибка,
  # там нужен ein. Отсюда has: [mass].
  # Прилагательное зафиксировано в рамке, а не берётся из лексикона: пары вида
  # «salzigen Zucker» и «scharfes Salz» собирались сами собой, а «gut» подходит всему.
  frame: "Ich kaufe gut{slot} {w}."
  # еда, питьё и Benzin: «guten Husten» и «guten Schimmel» тоже неисчисляемые, но их не покупают
  need: {pos: n, tags: [food, drink, thing], has: [mass], not: [pl_only, abstract]}
  slot: {paradigm: adj_ending, decl: strong, case: akk, num: sg, gender: from_word}
  why: adj-ohne-artikel

# Модальные глаголы. Их нет и не будет в лексиконе: они не принадлежат теме, это
# грамматика, поэтому таблица лежит в ядре рядом с артиклями. Варианты ответа —
# формы ТОГО ЖЕ модального в других лицах: спрашивается форма, а не выбор глагола.
# Инфинитив в конце берётся из лексикона, и отделяемые здесь наконец годятся:
# «Er kann heute aufräumen» — приставка остаётся при инфинитиве.
- id: modal-koennen-er
  rule: modalverben
  level: A1
  kind: choice
  frame: "Er {slot} heute {w}."
  need: {pos: v, tags: [solo], not: [reflexive]}
  slot: {paradigm: modal_present, modal: können, person: 3sg}
  options: {paradigm: modal_present, count: 4}
  why: modalverben

- id: modal-muessen-du
  rule: modalverben
  level: A1
  kind: choice
  frame: "Du {slot} heute {w}."
  need: {pos: v, tags: [solo], not: [reflexive]}
  slot: {paradigm: modal_present, modal: müssen, person: 2sg}
  options: {paradigm: modal_present, count: 4}
  why: modalverben

# Множественное: после артикля окончание всегда -en, род больше не важен.
- id: adj-plural-die
  rule: adj-plural
  level: A2
  kind: input
  frame: "Ich sehe die gut{slot} {w}."
  need: {pos: n, tags: [thing, food, vehicle, furniture], has: [pl], not: [npl, mass, abstract]}
  slot: {paradigm: adj_ending, decl: weak, case: akk, num: pl, gender: from_word}
  why: adj-plural

# Предикатив: прилагательное после ist не склоняется вообще. Это единственное место,
# где варианты ответа зависят от слова — верное это само прилагательное, а ошибки
# те окончания, которые рука дописывает по привычке.
# Сюда же наконец попадают прилагательные про человека: их не берёт ни одна рамка
# с предметом, а здесь они на своём месте.
- id: adj-praedikativ-person
  rule: adj-praedikativ
  level: A1
  kind: choice
  frame: "{Art2} {w2} ist {slot}."
  need: {pos: a, tags: [person]}
  fill2: {need: {pos: n, tags: [person], not: [pl_only, plu]}, case: nom}
  slot: {paradigm: adj_predicative}
  options: {paradigm: adj_predicative, count: 4}
  why: adj-praedikativ

# Слова времени не брала ни одна рамка: в «Hier ist …» и «… ist ein Problem»
# тега time нет, а своего вопроса у них не было.
- id: nom-subjekt-wann
  rule: nominativ-subjekt
  level: A1
  kind: choice
  frame: "Wann ist {slot} {w}?"
  need: {pos: n, tags: [time], not: [pl_only, plu]}
  slot: {paradigm: def_article, case: nom, num: sg}
  options: {paradigm: def_article, count: 4}
  why: nominativ-subjekt

# Личные местоимения: род берёт предмет, а не человек. Русскому кажется, что вещь — «оно»,
# и он говорит es про стол и про дверь. Варианты — все формы третьего лица.
- id: pronomen-akk-suchen
  rule: pronomen-akkusativ
  level: A1
  kind: choice
  frame: "{Nom} {w} ist weg — ich suche {slot}."
  need: {pos: n, tags: [thing, document, vehicle, furniture], not: [pl_only, plu, mass]}
  slot: {paradigm: pronoun, case: akk, num: sg}
  options: {paradigm: pronoun, count: 4}
  why: pronomen-akkusativ

# ─── Переходные глаголы. До сих пор их не брала ни одна рамка: все глагольные
# шаблоны требуют тег solo, потому что «Er erreicht oft» не фраза. Сорок три глагола
# лежали мёртвым грузом — больше, чем любая другая дыра в данных.
# Объект здесь не берётся из лексикона: именно так получались «Er würzt das Salz»
# и «Er kocht das Wohnzimmer» (отвергнутое решение, docs/architecture.md). Объект —
# местоимение «das», оно подходит любому глаголу с объектом-предметом. А глаголы,
# у которых объект человек, отделены тегом obj_person и получают «ihn».
- id: praesens-er-obj
  rule: praesens-3sg
  level: A2
  kind: input
  frame: "Er {slot} das heute."
  # placement исключены: «Er stellt das heute» без «куда» не фраза
  need: {pos: v, tags: [obj], not: [sep, reflexive, obj_person, placement]}
  slot: {paradigm: verb_present, person: 3sg}
  why: praesens-3sg

- id: praesens-du-person
  rule: praesens-2sg
  level: A2
  kind: input
  frame: "Du {slot} ihn heute."
  need: {pos: v, tags: [obj_person], not: [sep, reflexive]}
  slot: {paradigm: verb_present, person: 2sg}
  why: praesens-2sg

- id: partizip-das
  rule: perfekt-partizip
  level: A2
  kind: input
  frame: "Ich habe das schon {slot}."
  need: {pos: v, tags: [obj], not: [aux_hs, obj_person, placement]}
  slot: {paradigm: participle}
  why: perfekt-partizip

# Отделяемый глагол с объектом: приставка уходит за объект, а не сразу за глагол.
# «Ich melde das an», не «Ich melde an das» — порядок слов и есть урок рамки.
- id: trennbar-obj
  rule: praesens-trennbar
  level: A2
  kind: input
  frame: "Ich {slot} das heute {particle}."
  need: {pos: v, tags: [obj], has: [sep], not: [obj_person, reflexive]}
  slot: {paradigm: verb_stem, person: 1sg}
  why: praesens-trennbar

# Глаголы перемещения: в рамках Wechselpräposition они стоят в рамке как слово
# («Ich stelle die Lampe auf …»), а спросить их было нечем. Вопрос «куда» их и ждёт.
- id: praesens-du-wohin
  rule: praesens-2sg
  level: A1
  kind: input
  frame: "Wohin {slot} du das?"
  need: {pos: v, tags: [placement]}
  slot: {paradigm: verb_present, person: 2sg}
  why: praesens-2sg

# Прилагательные без степеней сравнения (тег absolute) не брала ни одна рамка:
# из сравнения они исключены, а в рамках с существительным нужен тег generic —
# «die vegetarische Ampel» собиралось бы само. Предикатив их и ждёт, и подлежащее
# здесь «das»: пары прилагательное × существительное тут нет вообще.
# Так эти слова и употребляют в жизни — спрашивают у стойки.
- id: adj-praedikativ-ding
  rule: adj-praedikativ
  level: A1
  kind: choice
  frame: "Ist das {slot}?"
  # «Ist das schwanger?» — поэтому про человека отсюда вон: они в рамке с лицом
  need: {pos: a, tags: [absolute], not: [person]}
  slot: {paradigm: adj_predicative}
  options: {paradigm: adj_predicative, count: 4}
  why: adj-praedikativ
