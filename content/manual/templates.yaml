# ⚠ Сильное склонение голодало: без артикля стоят только неисчисляемые, а их
# в лексиконе три десятка на 1836 слов — 58 заданий против полутора тысяч
# у соседних типов. Во множественном неисчисляемость не нужна: «gute Bücher»,
# «mit guten Freunden» — артикля нет, а слов сотни. Окончания там свои,
# -e и -en, и путают их ровно так же.
- id: adj-stark-plural-akk
  rule: adj-ohne-artikel
  level: A2
  kind: input
  frame: "Hier gibt es gut{slot} {w}."
  need: {pos: n, tags: [thing, food, furniture, vehicle, place, document], has: [pl], not: [npl, pl_only, mass, plu, abstract]}
  slot: {paradigm: adj_ending, decl: strong, case: akk, num: pl, gender: from_word}
  why: adj-ohne-artikel

- id: adj-stark-plural-dat
  rule: adj-ohne-artikel
  level: B1
  kind: input
  frame: "Mit gut{slot} {w} ist alles einfacher."
  need: {pos: n, tags: [thing, furniture, appliance, document], has: [pl], not: [npl, pl_only, mass, plu, abstract]}
  slot: {paradigm: adj_ending, decl: strong, case: dat, num: pl, gender: from_word}
  why: adj-ohne-artikel
