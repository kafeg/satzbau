  why: praeteritum

# Без артикля прилагательное берёт его окончание на себя — сильное склонение.
# Существительное первым, прилагательное вторым, оба из темы Еда: там без артикля
# говорят чаще всего («Ich mag frischen Fisch»).
- id: adj-stark-gut
  rule: adj-ohne-artikel
  level: A2
  kind: input
  # ⚠ Без артикля стоят только неисчисляемые: «Ich kaufe frische Banane» — ошибка,
  # там нужен ein. Отсюда has: [mass].
  # Прилагательное зафиксировано в рамке, а не берётся из лексикона: пары вида
  # «salzigen Zucker» и «scharfes Salz» собирались сами собой, а «gut» подходит всему.
  frame: "Ich kaufe gut{slot} {w}."
  # еда, питьё и Benzin. «guten Schimmel» и «guten Strom» тоже неисчисляемые, но их
  # не покупают — оба помечены abstract именно поэтому, и not их отсекает
  need: {pos: n, tags: [food, drink, thing], has: [mass], not: [pl_only, abstract]}
  slot: {paradigm: adj_ending, decl: strong, case: akk, num: sg, gender: from_word}
  why: adj-ohne-artikel

# Модальные глаголы. Их нет и не будет в лексиконе: они не принадлежат теме, это
# грамматика, поэтому таблица лежит в ядре рядом с артиклями. Варианты ответа —
# формы ТОГО ЖЕ модального в других лицах: спрашивается форма, а не выбор глагола.
# Инфинитив в конце берётся из лексикона, и отделяемые здесь наконец годятся:
# «Er kann heute aufräumen» — приставка остаётся при инфинитиве.
- id: modal-koennen-er
  rule: modalverben
  level: A1
  kind: choice
  frame: "{Subj} {slot} heute {w}."
  need: {pos: v, tags: [solo], not: [reflexive]}
  # лицо выводится из слова: с «Er» ответ был бы «kann» на всех 74 заданиях
  slot: {paradigm: modal_present, modal: können, person: from_word}
  options: {paradigm: modal_present, count: 4}
  why: modalverben

- id: modal-muessen-du
  rule: modalverben
  level: A1
  kind: choice
  frame: "{Subj} {slot} heute {w}."
  need: {pos: v, tags: [solo], not: [reflexive]}
  slot: {paradigm: modal_present, modal: müssen, person: from_word}
  options: {paradigm: modal_present, count: 4}
  why: modalverben

# Множественное: после артикля окончание всегда -en, род больше не важен.
- id: adj-plural-die
  rule: adj-plural
  level: A2
  kind: input
  frame: "Ich sehe die gut{slot} {w}."
  need: {pos: n, tags: [thing, food, vehicle, furniture], has: [pl], not: [npl, mass, abstract]}
  slot: {paradigm: adj_ending, decl: weak, case: akk, num: pl, gender: from_word}
  why: adj-plural

# Предикатив: прилагательное после ist не склоняется вообще. Это единственное место,
# где варианты ответа зависят от слова — верное это само прилагательное, а ошибки
# те окончания, которые рука дописывает по привычке.
# Сюда же наконец попадают прилагательные про человека: их не берёт ни одна рамка
# с предметом, а здесь они на своём месте.
- id: adj-praedikativ-person
  rule: adj-praedikativ
  level: A1
  kind: choice
  frame: "{Art2} {w2} ist {slot}."
  need: {pos: a, tags: [person]}
  fill2: {need: {pos: n, tags: [person], not: [pl_only, plu]}, case: nom}
  slot: {paradigm: adj_predicative}
  options: {paradigm: adj_predicative, count: 4}
  why: adj-praedikativ

# Слова времени не брала ни одна рамка: в «Hier ist …» и «… ist ein Problem»
# тега time нет, а своего вопроса у них не было.
- id: nom-subjekt-wann
  rule: nominativ-subjekt
  level: A1
  kind: choice
  frame: "Wann ist {slot} {w}?"
  need: {pos: n, tags: [time], not: [pl_only, plu, date]}
  slot: {paradigm: def_article, case: nom, num: sg}
  options: {paradigm: def_article, count: 4}
  why: nominativ-subjekt

# Личные местоимения: род берёт предмет, а не человек. Русскому кажется, что вещь — «оно»,
# и он говорит es про стол и про дверь. Варианты — все формы третьего лица.
- id: pronomen-akk-suchen
  rule: pronomen-akkusativ
  level: A1
  kind: choice
  frame: "{Nom} {wnom} ist weg — ich suche {slot}."
  need: {pos: n, tags: [thing, document, vehicle, furniture], not: [pl_only, plu, mass]}
  slot: {paradigm: pronoun, case: akk, num: sg}
  options: {paradigm: pronoun, count: 4}
  why: pronomen-akkusativ

# ─── Переходные глаголы. До сих пор их не брала ни одна рамка: все глагольные
# шаблоны требуют тег solo, потому что «Er erreicht oft» не фраза. Сорок три глагола
# лежали мёртвым грузом — больше, чем любая другая дыра в данных.
# Объект здесь не берётся из лексикона: именно так получались «Er würzt das Salz»
# и «Er kocht das Wohnzimmer» (отвергнутое решение, docs/architecture.md). Объект —
# местоимение «das», оно подходит любому глаголу с объектом-предметом. А глаголы,
# у которых объект человек, отделены тегом obj_person и получают «ihn».
- id: praesens-er-obj
  rule: praesens-3sg
  level: A2
  kind: input
  frame: "Er {slot} das heute."
  # placement исключены: «Er stellt das heute» без «куда» не фраза
  need: {pos: v, tags: [obj], not: [sep, reflexive, obj_person, placement]}
  slot: {paradigm: verb_present, person: 3sg}
  why: praesens-3sg

- id: praesens-du-person
  rule: praesens-2sg
  level: A2
  kind: input
  frame: "Du {slot} ihn heute."
  need: {pos: v, tags: [obj_person], not: [sep, reflexive]}
  slot: {paradigm: verb_present, person: 2sg}
  why: praesens-2sg

- id: partizip-das
  rule: perfekt-partizip
  level: A2
  kind: input
  frame: "Ich habe das schon {slot}."
  need: {pos: v, tags: [obj], not: [aux_hs, obj_person, placement]}
  slot: {paradigm: participle}
  why: perfekt-partizip

# Отделяемый глагол с объектом: приставка уходит за объект, а не сразу за глагол.
# «Ich melde das an», не «Ich melde an das» — порядок слов и есть урок рамки.
- id: trennbar-obj
  rule: praesens-trennbar
  level: A2
  kind: input
  frame: "Ich {slot} das heute {particle}."
  need: {pos: v, tags: [obj], has: [sep], not: [obj_person, reflexive]}
  slot: {paradigm: verb_stem, person: 1sg}
  why: praesens-trennbar

# То же, но объект — человек: «Ich rufe das an» не фраза, нужно местоимение-лицо
- id: trennbar-person
  rule: praesens-trennbar
  level: A2
  kind: input
  frame: "Ich {slot} ihn heute {particle}."
  need: {pos: v, tags: [obj_person], has: [sep], not: [reflexive]}
  slot: {paradigm: verb_stem, person: 1sg}
  why: praesens-trennbar

# Глаголы перемещения: в рамках Wechselpräposition они стоят в рамке как слово
# («Ich stelle die Lampe auf …»), а спросить их было нечем. Вопрос «куда» их и ждёт.
- id: praesens-du-wohin
  rule: praesens-2sg
  level: A1
  kind: input
  frame: "Wohin {slot} du das?"
  need: {pos: v, tags: [placement]}
  slot: {paradigm: verb_present, person: 2sg}
  why: praesens-2sg

# Прилагательные без степеней сравнения (тег absolute) не брала ни одна рамка:
# из сравнения они исключены, а в рамках с существительным нужен тег generic —
# «die vegetarische Ampel» собиралось бы само. Предикатив их и ждёт, и подлежащее
# здесь «das»: пары прилагательное × существительное тут нет вообще.
# Так эти слова и употребляют в жизни — спрашивают у стойки.
- id: adj-praedikativ-ding
  rule: adj-praedikativ
  level: A1
  kind: choice
  frame: "Ist das {slot}?"
  # «Ist das schwanger?» — поэтому про человека отсюда вон: они в рамке с лицом
  need: {pos: a, tags: [absolute], not: [person]}
  slot: {paradigm: adj_predicative}
  options: {paradigm: adj_predicative, count: 4}
  why: adj-praedikativ

# ─── Управление глаголов. Данные про него лежали в бандле с самого Э3 и не читались
# ни одним шаблоном: `gov` подтверждён руками у 29 глаголов, а правила не было.
# Пропуск — САМ ПРЕДЛОГ, и это главная боль русского: «ждать автобус» без предлога,
# а по-немецки warten AUF den Zug. Дополнение не подбирается из лексикона (так выходило
# «Er würzt das Salz»), а написано руками по глаголу — fixes.yaml:government_example.
# Падеж в дополнении уже стоит правильный: его задаёт то же управление.
# Одна рамка на все формы глагола: пустые подстановки генератор склеивает. {mich} —
# возвратное у sich bewerben, {pre} — прямое дополнение перед предлогом
# («das Geld auf das Konto»), {particle} — приставка отделяемого, она всегда последняя.
- id: verb-prep-ich
  rule: verb-praeposition
  level: A2
  kind: choice
  frame: "Ich {v1} {mich} {pre} {slot} {obj} {particle}."
  # position исключён: «Ich hänge an der Wand» — это про себя, у него своя рамка ниже
  need: {pos: v, has: [govex], not: [govex2, position]}
  slot: {paradigm: verb_prep}
  options: {paradigm: verb_prep, count: 4}
  why: verb-praeposition

# Подлежащее не человек: hängen, stehen. «Das hängt an der Wand» — то же местоимение
# без смысла, что и в рамках с объектом.
- id: verb-prep-ding
  rule: verb-praeposition
  level: A2
  kind: choice
  frame: "Das {v3} {pre} {slot} {obj}."
  need: {pos: v, has: [govex], tags: [position], not: [govex2]}
  slot: {paradigm: verb_prep}
  options: {paradigm: verb_prep, count: 4}
  why: verb-praeposition

# Два предлога у одного глагола — отдельное правило: сказать «anmelden требует für»
# было бы неправдой. Пример дополнения решает, какой предлог верный, поэтому ответ
# по-прежнему один. Два шаблона, а не два задания из одного: журнал хранит пару
# «шаблон + слово», и задание должно из неё восстанавливаться.
- id: verb-prep-zwei-a
  rule: verb-praeposition-zwei
  level: A2
  kind: choice
  frame: "Ich {v1} {mich} {pre} {slot} {obj} {particle}."
  need: {pos: v, has: [govex2]}
  slot: {paradigm: verb_prep, nth: 1}
  options: {paradigm: verb_prep, count: 4}
  why: verb-praeposition-zwei

- id: verb-prep-zwei-b
  rule: verb-praeposition-zwei
  level: A2
  kind: choice
  frame: "Ich {v1} {mich} {pre} {slot} {obj} {particle}."
  need: {pos: v, has: [govex2]}
  slot: {paradigm: verb_prep, nth: 2}
  options: {paradigm: verb_prep, count: 4}
  why: verb-praeposition-zwei

# ── Императив. Пропуск — сама форма, поэтому ввод: вариантов у неё нет.
# Перегласовка в императив не идёт (du fährst, но fahr!), а смена e→i идёт (gib!),
# и это ровно то, на чём ошибаются. Вывод проверяется против UniMorph.
- id: imperativ-du
  rule: imperativ
  level: A1
  kind: input
  frame: "{Slot} das bitte!"
  need: {pos: v, tags: [obj], not: [sep, reflexive, obj_person, placement]}
  slot: {paradigm: imperative}
  why: imperativ

- id: imperativ-trennbar
  rule: imperativ
  level: A1
  kind: input
  frame: "{Slot} das bitte {particle}!"
  need: {pos: v, tags: [obj], has: [sep], not: [obj_person, reflexive]}
  slot: {paradigm: imperative}
  why: imperativ

- id: imperativ-solo
  rule: imperativ
  level: A1
  kind: input
  frame: "{Slot} bitte!"
  need: {pos: v, tags: [solo], not: [sep, reflexive]}
  slot: {paradigm: imperative}
  why: imperativ

# ── nicht или kein. Два шаблона на одном инвентаре вариантов: иначе по виду
# вариантов видно, какой ответ нужен. Правило видно только из пары:
# без артикля отрицает kein, с определённым артиклем — nicht.
- id: nicht-kein-ohne
  rule: negation-nicht-kein
  level: A2
  kind: choice
  frame: "Ich finde {slot} {w}."
  need: {pos: n, tags: [thing, document, food, drink, furniture, appliance, vehicle], not: [pl_only, plu, mass]}
  slot: {paradigm: kein_article, case: akk, gender: from_word}
  options: {paradigm: negation, count: 4}
  why: negation-nicht-kein

- id: nicht-kein-mit
  rule: negation-nicht-kein
  level: A2
  kind: choice
  frame: "Ich finde {art} {w} {slot}."
  need: {pos: n, tags: [thing, document, food, drink, furniture, appliance, vehicle], not: [pl_only, plu, mass]}
  slot: {paradigm: nicht, case: akk, gender: from_word}
  options: {paradigm: negation, count: 4}
  why: negation-nicht-kein

# ── Местоимение в Dativ: ihm и ihr вместо ihn и sie.
- id: pronomen-dat-helfen
  rule: pronomen-dativ
  level: A2
  kind: choice
  frame: "{Nom} {wnom} ist nett — ich helfe {slot}."
  need: {pos: n, tags: [person], not: [pl_only, plu]}
  slot: {paradigm: pronoun, case: dat, gender: from_word}
  options: {paradigm: pronoun, count: 4}
  why: pronomen-dativ

# ── mein в Dativ: meinem и meiner. Рамка с mit, потому что mit всегда Dativ.
- id: possessiv-dat-mit
  rule: possessiv-dativ
  level: A2
  kind: choice
  frame: "Ich spreche mit {slot} {w}."
  need: {pos: n, tags: [person], not: [pl_only, plu]}
  slot: {paradigm: possessive, case: dat, gender: from_word}
  options: {paradigm: possessive, count: 4}
  why: possessiv-dativ

# ── n-склонение: der Nachbar, но den Nachbarn. Формы в данных есть (nd),
# и пропуск — само слово, поэтому ввод.
- id: n-dekl-akk
  rule: n-deklination
  level: A2
  kind: input
  frame: "Ich sehe {art} {slot}."
  need: {pos: n, has: [nd], not: [pl_only, plu]}
  slot: {paradigm: noun_case, case: akk, gender: from_word}
  why: n-deklination

- id: n-dekl-dat
  rule: n-deklination
  level: A2
  kind: input
  frame: "Ich helfe {art} {slot}."
  need: {pos: n, has: [nd], tags: [person], not: [pl_only, plu]}
  slot: {paradigm: noun_case, case: dat, gender: from_word}
  why: n-deklination

# ── Возвратные глаголы.
# {vp} — глагол в том же лице, что и подлежащее: лицо выводится из слова
- id: reflexiv-subj
  rule: reflexiv
  level: A2
  kind: choice
  frame: "{Subj} {vp} {slot} oft {particle}."
  need: {pos: v, has: [reflexive]}
  slot: {paradigm: reflexive_pronoun, person: from_word}
  options: {paradigm: reflexive_pronoun, count: 4}
  why: reflexiv

# ── Futur I: werden + инфинитив, и инфинитив уезжает в конец.
- id: futur-subj
  rule: futur
  level: A2
  kind: choice
  frame: "{Subj} {slot} morgen {w}."
  need: {pos: v, tags: [solo], not: [reflexive]}
  slot: {paradigm: werden_present, person: from_word}
  options: {paradigm: werden_present, count: 4}
  why: futur

# ── Konjunktiv II: würde + инфинитив.
- id: konjunktiv-subj
  rule: konjunktiv2
  level: B1
  kind: choice
  frame: "{Subj} {slot} gern {w}."
  need: {pos: v, tags: [solo], not: [reflexive]}
  slot: {paradigm: wuerde, person: from_word}
  options: {paradigm: wuerde, count: 4}
  why: konjunktiv2

# ── Passiv: werden + Partizip II. Подлежащее — то же местоимение без смысла,
# что и в рамках с объектом: кто делает, пассив как раз и не называет.
- id: passiv-das
  rule: passiv
  level: B1
  kind: choice
  frame: "Das {slot} heute {pp}."
  need: {pos: v, tags: [obj], not: [reflexive, obj_person, placement]}
  slot: {paradigm: werden_present, person: 3sg}
  options: {paradigm: werden_present, count: 4}
  why: passiv

- id: passiv-person
  rule: passiv
  level: B1
  kind: choice
  frame: "{Subj} {slot} heute {pp}."
  need: {pos: v, tags: [obj_person], not: [reflexive]}
  slot: {paradigm: werden_present, person: from_word}
  options: {paradigm: werden_present, count: 4}
  why: passiv

# ── man: безличное подлежащее, которого в русском нет. Пропуск — форма глагола,
# а не само man: четыре местоимения в этой рамке все были бы верны.
- id: man-3sg
  rule: man-subjekt
  level: A2
  kind: input
  frame: "Man {slot} hier oft."
  need: {pos: v, tags: [solo], not: [sep, reflexive]}
  slot: {paradigm: verb_present, person: 3sg}
  why: man-subjekt

# ── es gibt + Akkusativ. Рамка нужна именно из-за падежа: по смыслу тут «есть»,
# и рука ставит именительный.
- id: es-gibt-akk
  rule: es-gibt
  level: A1
  kind: choice
  frame: "Hier gibt es {slot} {w}."
  need: {pos: n, tags: [place, thing, document, food, drink, furniture, appliance], not: [pl_only, plu, mass]}
