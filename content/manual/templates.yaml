# ── Смешанное склонение: после ein окончание зависит от рода, в отличие от слабого,
# где после der оно -e во всех трёх. Здесь род наконец виден в ответе.
- id: adj-ein-nom
  rule: adj-gemischt
  level: A2
  kind: input
  frame: "Das ist {ein} {w2}{slot} {w}."
  need: {pos: n, tags: [thing, food, vehicle, room, furniture, place], not: [pl_only, plu, abstract, mass]}
  fill2: {need: {pos: a, tags: [generic]}}
  slot: {paradigm: adj_ending, decl: mixed, case: nom, num: sg, gender: from_word}
  why: adj-gemischt

- id: adj-ein-akk
  rule: adj-gemischt
  level: A2
  kind: input
  frame: "Ich brauche {ein} {w2}{slot} {w}."
  need: {pos: n, tags: [thing, food, vehicle, room, furniture, place], not: [pl_only, plu, abstract, mass]}
  fill2: {need: {pos: a, tags: [generic]}}
  slot: {paradigm: adj_ending, decl: mixed, case: akk, num: sg, gender: from_word}
  why: adj-gemischt

# ── Род: три кнопки. Единственное задание, где оценивается СЛОВО, а не правило на нём.
# ⚠ Бейдж рода у слова в дрилле здесь прячется: иначе ответ написан на экране.
- id: genus-das-ist
  rule: genus
  level: A1
  kind: choice
  # ⚠ Было «Das ist {slot} {w}»: у среднего рода ответ стоял первым словом фразы,
  # и 349 заданий из 1792 решались копированием. Поймано на живом занятии.
  frame: "Hier ist {slot} {w}."
  need: {pos: n, not: [pl_only, plu, noart, g2]}
  slot: {paradigm: def_article, case: nom, num: sg, gender: from_word}
  options: {paradigm: genus, count: 3}
  why: genus

# Безличные глаголы погоды: подлежащее у них только es. Ни solo, ни obj им не подходят
# («Er regnet oft», «Er regnet das heute»), поэтому до тега weather их не брала ни одна
# рамка. Здесь пропуск — та же форма третьего лица, что и в «Er … oft».
- id: praesens-es-wetter
  rule: praesens-3sg
  level: A1
  kind: input
  frame: "Heute {slot} es."
  need: {pos: v, tags: [weather]}
  slot: {paradigm: verb_present, person: 3sg}
  why: praesens-3sg

- id: partizip-es-wetter
  rule: perfekt-partizip
  level: A1
  kind: input
  frame: "Gestern hat es {slot}."
  need: {pos: v, tags: [weather]}
  slot: {paradigm: participle}
  why: perfekt-partizip

# ⚠ Рамка против вырожденного ответа. `merge-wo-in` даёт `im` на ВС�ём наполнении:
# in + dem склеивается одинаково у мужского и среднего, а женский в неё не пускают
# (in + der не склеивается вовсе). У `zu` склеиваются все три рода и по-разному —
# zum против zur, — поэтому ответ наконец зависит от слова, а не от шаблона.
- id: merge-wohin-zu
  rule: merge-prep-article
  level: A2
  kind: choice
  frame: "Ich gehe {slot} {w}."
  need: {pos: n, tags: [place, room], not: [pl_only, plu, noart]}
  slot: {paradigm: merged_prep_article, prep: zu, case: dat, num: sg}
  options: {paradigm: merged_prep_article, count: 4}
  why: merge-prep-article

# ⚠ Рамки против вырожденного правила. «Слабое склонение в именительном» — это
# окончание -e у ВСЕХ трёх родов, то есть у правила один ответ на всё наполнение
# и тренировать нечего. Меняется оно во множественном: «der gute Weg», но
# «die guten Wege». Теперь правило охватывает обе половины факта, и прочитать
# рамку приходится.
- id: adj-nom-plural
  rule: adj-nom-e
  level: A2
  kind: input
  frame: "Hier sind {art} {w2}{slot} {w}."
  need: {pos: n, tags: [thing, food, vehicle, furniture], has: [pl], not: [npl, mass, abstract]}
  fill2: {need: {pos: a, tags: [generic]}}
  slot: {paradigm: adj_ending, decl: weak, case: nom, num: pl, gender: from_word}
  why: adj-nom-e

# ⚠ То же у множественного: после артикля всегда -en, без артикля -e. Пока правило
# знало только рамку с «die», ответ был константой. Контраст «die guten Wege» против
# «gute Wege» и есть то, чему учит правило.
- id: adj-plural-ohne
  rule: adj-plural
  level: B1
  kind: input
  frame: "Hier sind gut{slot} {w}."
  need: {pos: n, tags: [thing, food, vehicle, furniture], has: [pl], not: [npl, mass, abstract]}
  slot: {paradigm: adj_ending, decl: strong, case: nom, num: pl, gender: from_word}
  why: adj-plural


# ══ Вторые и третьи рамки правилам, у которых была ровно одна ══
# ⚠ При одной рамке через месяц человек знает не правило, а конкретную фразу:
# «Ich fahre mit dem …» он доигрывает по памяти, не прочитав, какой падеж нужен.
# Медиана была две рамки на правило, у девятнадцати правил — одна.

- id: possessiv-nom-ding
  rule: possessiv-nominativ
  level: A1
  kind: choice
  frame: "{Slot} {w} ist weg."
  need: {pos: n, tags: [thing, document, vehicle], not: [pl_only, plu, mass]}
