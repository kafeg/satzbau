- id: adj-ein-akk
  rule: adj-gemischt
  level: A2
  kind: input
  frame: "Ich brauche {ein} {w2}{slot} {w}."
  need: {pos: n, tags: [thing, food, vehicle, room, furniture, place], not: [pl_only, plu, abstract, mass]}
