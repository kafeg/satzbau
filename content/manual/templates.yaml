  options: {paradigm: def_article, count: 4}
  why: prep-genitiv

# ── Смешанное склонение: после ein окончание зависит от рода, в отличие от слабого,
# где после der оно -e во всех трёх. Здесь род наконец виден в ответе.
- id: adj-ein-nom
  rule: adj-gemischt
  level: A2
  kind: input
  frame: "Das ist {ein} {w2}{slot} {w}."
  need: {pos: n, tags: [thing, food, vehicle, room, furniture, place], not: [pl_only, plu, abstract, mass]}
  fill2: {need: {pos: a, tags: [generic]}}
