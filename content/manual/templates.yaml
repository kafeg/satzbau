# Шаблоны заданий. Задание = шаблон × слово из лексикона; сами задания не хранятся.
#
# ЕДИНАЯ ФОРМА для всех типов: фраза с одним пропуском. Так валидатор и оценка
# устроены одинаково, а разнообразие даёт не форма задания, а правило в пропуске.
#
# Поля:
#   id       уникальный
#   rule     единица повтора и ключ в explain.yaml
#   level    A1 | A2 | B1
#   kind     choice (выбрать из вариантов) | input (ввести форму)
#   frame    фраза; {slot} — пропуск, {w} — слово, {W} — слово с большой буквы
#   need     условие на наполнение: pos, theme, tags (ЛЮБОЙ из перечисленных), lv_max, has, not
#   slot     что стоит в пропуске: парадигма + её параметры
#   options  только для kind: choice — из какой парадигмы берутся варианты и сколько их
#   why      ключ объяснения
#
# Варианты ответа берутся из ИНВЕНТАРЯ ФОРМ парадигмы, а не «то же слово в других падежах»:
# иначе для женского рода набор вырождается (Nom die, Akk die, Dat der, Gen der — два дубля).
#
# ⚠ count не может быть больше инвентаря. У aux_present в первом лице это ровно две формы,
# habe и bin: просить четыре — значит добить набор формами других лиц (hat, ist), а это
# проверка лица, а не выбора вспомогательного. Поэтому у двух шаблонов Perfekt count: 2.
# У merge-wo-in оставлено 4, но это ТРЕБОВАНИЕ К ЯДРУ: склеенных форм с предлогом in
# всего две (im, ins), и чтобы вариантов было четыре, инвентарь парадигмы должен включать
# несклеенные in dem / in das. Это и есть полезный дистрактор: «надо было склеить».

- id: prep-dat-mit
  rule: prep-dativ
  level: A1
  kind: choice
  frame: "Ich fahre mit {slot} {w}."
  need: {pos: n, theme: transport, tags: [vehicle], not: [pl_only]}
  slot: {paradigm: def_article, case: dat, num: sg, prep: mit}
  options: {paradigm: def_article, count: 4}
  why: prep-dativ

# Было записано как prep-akkusativ, но предлога во фразе нет: падеж здесь требует
# глагол, а не предлог. Это отдельное правило, и объяснение у него своё.
- id: akk-objekt-brauchen
  rule: akkusativ-objekt
  level: A1
  kind: choice
  frame: "Ich brauche {slot} {w}."
  need: {pos: n, tags: [document, thing], not: [pl_only, plu, mass]}
  slot: {paradigm: indef_article, case: akk, num: sg}
  options: {paradigm: indef_article, count: 4}
  why: akkusativ-objekt

- id: prep-akk-fuer
  rule: prep-akkusativ
  level: A1
  kind: choice
  frame: "Das Geschenk ist für {slot} {w}."
  need: {pos: n, tags: [person], not: [pl_only, plu]}
  slot: {paradigm: def_article, case: akk, num: sg, prep: für}
  options: {paradigm: def_article, count: 4}
  why: prep-akkusativ

- id: merge-wo-in
  rule: merge-prep-article
  level: A2
  kind: choice
  frame: "Wir sind {slot} {w}."
  need: {pos: n, tags: [room], g: [m, n], not: [pl_only]}
  slot: {paradigm: merged_prep_article, prep: in, case: dat, num: sg}
  options: {paradigm: merged_prep_article, prep: in, count: 4}
  why: merge-prep-article

# Второй шаблон на то же правило, и снова не для красоты: с одним шаблоном ответ
# «im» верен на всём наполнении, и человек отвечает не глядя. Пара wo/wohin даёт
# im против ins — то есть собственно Wechselpräposition.
- id: merge-wohin-in
  rule: merge-prep-article
  level: A2
  kind: choice
  frame: "Wir gehen {slot} {w}."
  need: {pos: n, tags: [room], g: [n], not: [pl_only]}
  slot: {paradigm: merged_prep_article, prep: in, case: akk, num: sg}
  options: {paradigm: merged_prep_article, prep: in, count: 4}
  why: merge-prep-article

- id: akk-objekt-essen
  rule: akkusativ-objekt
  level: A1
  kind: choice
  frame: "Ich esse {slot} {w}."
  need: {pos: n, tags: [food], not: [meal, abstract, mass, pl_only, plu, npl]}
  slot: {paradigm: indef_article, case: akk, num: sg}
  options: {paradigm: indef_article, count: 4}
  why: akkusativ-objekt

- id: akk-objekt-trinken
  rule: akkusativ-objekt
  level: A1
  kind: choice
  frame: "Ich trinke {slot} {w}."
  need: {pos: n, tags: [drink], not: [mass, pl_only, plu]}
  slot: {paradigm: indef_article, case: akk, num: sg}
  options: {paradigm: indef_article, count: 4}
  why: akkusativ-objekt

# mit, а не bei или von: те сливаются с артиклем обязательно («beim Arzt», не «bei dem Arzt»),
# и тренировать на них чистый артикль нельзя — это уже правило о слияниях.
- id: prep-dat-mit-person
  rule: prep-dativ
  level: A1
  kind: choice
  frame: "Ich spreche mit {slot} {w}."
  need: {pos: n, tags: [person], not: [pl_only, plu]}
  slot: {paradigm: def_article, case: dat, num: sg, prep: mit}
  options: {paradigm: def_article, count: 4}
  why: prep-dativ

- id: prep-dat-aus-raum
  rule: prep-dativ
  level: A1
  kind: choice
  frame: "Ich komme gerade aus {slot} {w}."
  need: {pos: n, tags: [room], not: [pl_only]}
  slot: {paradigm: def_article, case: dat, num: sg, prep: aus}
  options: {paradigm: def_article, count: 4}
  why: prep-dativ

- id: prep-akk-ohne
  rule: prep-akkusativ
  level: A1
  kind: choice
  frame: "Ich komme ohne {slot} {w}."
  need: {pos: n, tags: [document], not: [pl_only, plu]}
  slot: {paradigm: def_article, case: akk, num: sg, prep: ohne}
  options: {paradigm: def_article, count: 4}
  why: prep-akkusativ

- id: nom-subjekt-hier
  rule: nominativ-subjekt
  level: A1
  kind: choice
  frame: "Hier ist {slot} {w}."
  need: {pos: n, tags: [room, place, appliance, furniture], not: [pl_only, plu]}
  slot: {paradigm: def_article, case: nom, num: sg}
  options: {paradigm: def_article, count: 4}
  why: nominativ-subjekt

# Второй шаблон на то же правило — ради темы Работа: её слова почти все абстрактные,
# и «Hier ist die Kündigung» не фраза, а «Die Kündigung ist ein Problem» — фраза.
- id: nom-subjekt-problem
  rule: nominativ-subjekt
  level: A2
  kind: choice
  frame: "{Slot} {w} ist ein Problem."
  need: {pos: n, tags: [abstract, money, illness], not: [pl_only, plu]}
  slot: {paradigm: def_article, case: nom, num: sg}
  options: {paradigm: def_article, count: 4}
  why: nominativ-subjekt

# Притяжательное склоняется как ein: mein — meine — meinen. Слот стоит первым словом,
# поэтому {Slot} с большой буквы.
- id: possessiv-koerper
  rule: possessiv-nominativ
  level: A1
  kind: choice
  frame: "{Slot} {w} tut weh."
  need: {pos: n, tags: [body], not: [pl_only, plu, abstract, mass]}
  slot: {paradigm: possessive, case: nom, num: sg}
  options: {paradigm: possessive, count: 4}
  why: possessiv-nominativ

- id: negation-kein-haben
  rule: negation-kein
  level: A1
  kind: choice
  frame: "Ich habe {slot} {w}."
  need: {pos: n, tags: [illness, document], not: [pl_only, plu]}
  slot: {paradigm: kein_article, case: akk, num: sg}
  options: {paradigm: kein_article, count: 4}
  why: negation-kein

# Формы самого слова: вариантов нет, только ввод.
- id: plural-kaufen
  rule: plural-form
  level: A1
  kind: input
  frame: "Hier sind zwei {slot}."
  need: {pos: n, tags: [food, thing], has: [pl], not: [meal, pl_only, npl, mass, plu]}
  slot: {paradigm: noun_plural, case: akk, num: pl}
  why: plural-form

- id: partizip-wohnung
  rule: perfekt-partizip
  level: A1
  kind: input
  frame: "Ich habe die Wohnung {slot}."
  need: {pos: v, tags: [housework], not: [aux_hs]}
  slot: {paradigm: participle}
  why: perfekt-partizip

# Условие — не тема, а тег solo: «Er erreicht oft» не фраза, потому что erreichen
# требует объект. Отделяемые исключены: приставка уходит в конец, а после пропуска
# стоит «oft» — вышло бы «Er zieht um oft».
- id: partizip-gestern
  rule: perfekt-partizip
  level: A1
  kind: input
  frame: "Gestern habe ich {slot}."
  need: {pos: v, tags: [solo], not: [sep, aux_s, aux_hs, reflexive]}
  slot: {paradigm: participle}
  why: perfekt-partizip

- id: praesens-er
  rule: praesens-3sg
  level: A1
  kind: input
  frame: "Er {slot} oft."
  need: {pos: v, tags: [solo], not: [sep, reflexive]}
  slot: {paradigm: verb_present, person: 3sg}
  why: praesens-3sg

- id: praesens-du
  rule: praesens-2sg
  level: A1
  kind: input
  frame: "Du {slot} oft."
  need: {pos: v, tags: [solo], not: [sep, reflexive]}
  slot: {paradigm: verb_present, person: 2sg}
  why: praesens-2sg

- id: adj-nom-ding
  rule: adj-nom-e
  level: A2
  kind: input
  frame: "Wo ist {art} {w2}{slot} {w}?"
  need: {pos: n, tags: [thing, food, vehicle, room, furniture, place], not: [pl_only, plu, abstract, mass]}
  fill2: {need: {pos: a, tags: [generic]}}
  slot: {paradigm: adj_ending, decl: weak, case: nom, num: sg, gender: from_word}
  why: adj-nom-e

- id: adj-akk-ding
  rule: adj-akk-en
  level: A2
  kind: input
  frame: "Ich sehe {art} {w2}{slot} {w}."
  need: {pos: n, tags: [thing, food, vehicle, room, furniture, place], not: [pl_only, plu, abstract, mass]}
  fill2: {need: {pos: a, tags: [generic]}}
  slot: {paradigm: adj_ending, decl: weak, case: akk, num: sg, gender: from_word}
  why: adj-akk-en

# --- Э7, продолжение ----------------------------------------------------------
# Предлоги на то же правило: у wo?/wohin? было по одному предлогу и 11 заданий.
# neben и unter с артиклем не сливаются, поэтому на них тренируется чистый падеж.

- id: possessiv-akk-suchen
  rule: possessiv-akkusativ
  level: A1
  kind: choice
  # только документы: тег thing включает и Ampel с Boden, а «Ich suche meine Ampel»
  # никто не скажет. Своего слова для «предмет, который бывает личным» у нас нет.
  frame: "Ich suche {slot} {w}."
  need: {pos: n, tags: [document], not: [pl_only, plu, mass]}
  slot: {paradigm: possessive, case: akk, num: sg}
  options: {paradigm: possessive, count: 4}
  why: possessiv-akkusativ

# Степени сравнения: морфология для них была написана и проверена ещё на Э3,
# но ни один шаблон её не просил — как раньше со спряжением.
- id: komparativ-als
  rule: komparativ
  level: A2
  kind: input
  frame: "Heute ist es {slot} als gestern."
  # безличное «es» — это про обстановку: «Heute ist es breiter» не фраза
  need: {pos: a, not: [person, absolute, thing_only]}
  slot: {paradigm: adj_comparative}
  why: komparativ

- id: superlativ-von-allen
  rule: komparativ
  level: A2
  kind: input
  frame: "Das ist {slot} von allen."
  need: {pos: a, not: [person, absolute]}
  slot: {paradigm: adj_superlative}
  why: komparativ

# Управление глагола живёт в рамке, а не в данных: подтверждённого управления у нас
# на 29 глаголов, и с Dativ из них два. Поэтому глагол фиксирован, а меняется лицо.
- id: dativ-objekt-helfen
  rule: dativ-objekt
  level: A2
  kind: choice
  frame: "Ich helfe {slot} {w}."
  need: {pos: n, tags: [person], not: [pl_only, plu]}
  slot: {paradigm: def_article, case: dat, num: sg}
  options: {paradigm: def_article, count: 4}
  why: dativ-objekt

- id: dativ-objekt-antworten
  rule: dativ-objekt
  level: A2
  kind: choice
  frame: "Ich antworte {slot} {w}."
  need: {pos: n, tags: [person], not: [pl_only, plu]}
  slot: {paradigm: def_article, case: dat, num: sg}
  options: {paradigm: def_article, count: 4}
  why: dativ-objekt

- id: genitiv-besitz
  rule: genitiv-besitz
  level: B1
  kind: choice
  frame: "Das ist das Auto {slot} {w}."
  need: {pos: n, tags: [person], not: [pl_only, plu]}
  slot: {paradigm: def_article, case: gen, num: sg}
  options: {paradigm: def_article, count: 4}
  why: genitiv-besitz

# Präteritum: форма лежит в данных у всех 131 глагола (72 слабых, 59 сильных),
# но до сих пор её никто не спрашивал. Отделяемые исключены: у них pt это «zog um»,
# и приставка внутри пропуска сломала бы фразу.
- id: praeteritum-frueher
  rule: praeteritum
  level: B1
  kind: input
  frame: "Früher {slot} ich oft."
  need: {pos: v, tags: [solo], not: [sep, reflexive]}
  slot: {paradigm: verb_past}
  why: praeteritum

# Без артикля прилагательное берёт его окончание на себя — сильное склонение.
# Существительное первым, прилагательное вторым, оба из темы Еда: там без артикля
# говорят чаще всего («Ich mag frischen Fisch»).
- id: adj-stark-gut
  rule: adj-ohne-artikel
  level: A2
  kind: input
  # ⚠ Без артикля стоят только неисчисляемые: «Ich kaufe frische Banane» — ошибка,
  # там нужен ein. Отсюда has: [mass].
  # Прилагательное зафиксировано в рамке, а не берётся из лексикона: пары вида
  # «salzigen Zucker» и «scharfes Salz» собирались сами собой, а «gut» подходит всему.
  frame: "Ich kaufe gut{slot} {w}."
  # еда, питьё и Benzin. «guten Schimmel» и «guten Strom» тоже неисчисляемые, но их
  # не покупают — оба помечены abstract именно поэтому, и not их отсекает
  need: {pos: n, tags: [food, drink, thing], has: [mass], not: [pl_only, abstract]}
  slot: {paradigm: adj_ending, decl: strong, case: akk, num: sg, gender: from_word}
  why: adj-ohne-artikel

# Модальные глаголы. Их нет и не будет в лексиконе: они не принадлежат теме, это
# грамматика, поэтому таблица лежит в ядре рядом с артиклями. Варианты ответа —
# формы ТОГО ЖЕ модального в других лицах: спрашивается форма, а не выбор глагола.
# Инфинитив в конце берётся из лексикона, и отделяемые здесь наконец годятся:
# «Er kann heute aufräumen» — приставка остаётся при инфинитиве.
- id: modal-koennen-er
  rule: modalverben
  level: A1
  kind: choice
  frame: "{Subj} {slot} heute {w}."
  need: {pos: v, tags: [solo], not: [reflexive]}
  # лицо выводится из слова: с «Er» ответ был бы «kann» на всех 74 заданиях
  slot: {paradigm: modal_present, modal: können, person: from_word}
  options: {paradigm: modal_present, count: 4}
  why: modalverben

- id: modal-muessen-du
  rule: modalverben
  level: A1
  kind: choice
  frame: "{Subj} {slot} heute {w}."
  need: {pos: v, tags: [solo], not: [reflexive]}
  slot: {paradigm: modal_present, modal: müssen, person: from_word}
  options: {paradigm: modal_present, count: 4}
  why: modalverben

# Множественное: после артикля окончание всегда -en, род больше не важен.
- id: adj-plural-die
  rule: adj-plural
  level: A2
  kind: input
  frame: "Ich sehe die gut{slot} {w}."
  need: {pos: n, tags: [thing, food, vehicle, furniture], has: [pl], not: [npl, mass, abstract]}
  slot: {paradigm: adj_ending, decl: weak, case: akk, num: pl, gender: from_word}
  why: adj-plural

# Предикатив: прилагательное после ist не склоняется вообще. Это единственное место,
# где варианты ответа зависят от слова — верное это само прилагательное, а ошибки
# те окончания, которые рука дописывает по привычке.
# Сюда же наконец попадают прилагательные про человека: их не берёт ни одна рамка
# с предметом, а здесь они на своём месте.
- id: adj-praedikativ-person
  rule: adj-praedikativ
  level: A1
  kind: choice
  frame: "{Art2} {w2} ist {slot}."
  need: {pos: a, tags: [person]}
  fill2: {need: {pos: n, tags: [person], not: [pl_only, plu]}, case: nom}
  slot: {paradigm: adj_predicative}
  options: {paradigm: adj_predicative, count: 4}
  why: adj-praedikativ

# Слова времени не брала ни одна рамка: в «Hier ist …» и «… ist ein Problem»
# тега time нет, а своего вопроса у них не было.
- id: nom-subjekt-wann
  rule: nominativ-subjekt
  level: A1
  kind: choice
  frame: "Wann ist {slot} {w}?"
  need: {pos: n, tags: [time], not: [pl_only, plu, date]}
  slot: {paradigm: def_article, case: nom, num: sg}
  options: {paradigm: def_article, count: 4}
  why: nominativ-subjekt

# Личные местоимения: род берёт предмет, а не человек. Русскому кажется, что вещь — «оно»,
# и он говорит es про стол и про дверь. Варианты — все формы третьего лица.
- id: pronomen-akk-suchen
  rule: pronomen-akkusativ
  level: A1
  kind: choice
  frame: "{Nom} {wnom} ist weg — ich suche {slot}."
  need: {pos: n, tags: [thing, document, vehicle, furniture], not: [pl_only, plu, mass]}
  slot: {paradigm: pronoun, case: akk, num: sg}
  options: {paradigm: pronoun, count: 4}
  why: pronomen-akkusativ

# ─── Переходные глаголы. До сих пор их не брала ни одна рамка: все глагольные
# шаблоны требуют тег solo, потому что «Er erreicht oft» не фраза. Сорок три глагола
# лежали мёртвым грузом — больше, чем любая другая дыра в данных.
# Объект здесь не берётся из лексикона: именно так получались «Er würzt das Salz»
# и «Er kocht das Wohnzimmer» (отвергнутое решение, docs/architecture.md). Объект —
# местоимение «das», оно подходит любому глаголу с объектом-предметом. А глаголы,
# у которых объект человек, отделены тегом obj_person и получают «ihn».
- id: praesens-er-obj
  rule: praesens-3sg
  level: A2
  kind: input
  frame: "Er {slot} das heute."
  # placement исключены: «Er stellt das heute» без «куда» не фраза
  need: {pos: v, tags: [obj], not: [sep, reflexive, obj_person, placement]}
  slot: {paradigm: verb_present, person: 3sg}
  why: praesens-3sg

- id: praesens-du-person
  rule: praesens-2sg
  level: A2
  kind: input
  frame: "Du {slot} ihn heute."
  need: {pos: v, tags: [obj_person], not: [sep, reflexive]}
  slot: {paradigm: verb_present, person: 2sg}
  why: praesens-2sg

- id: partizip-das
  rule: perfekt-partizip
  level: A2
  kind: input
  frame: "Ich habe das schon {slot}."
  need: {pos: v, tags: [obj], not: [aux_hs, obj_person, placement]}
  slot: {paradigm: participle}
  why: perfekt-partizip

# Глаголы перемещения: в рамках Wechselpräposition они стоят в рамке как слово
# («Ich stelle die Lampe auf …»), а спросить их было нечем. Вопрос «куда» их и ждёт.
- id: praesens-du-wohin
  rule: praesens-2sg
  level: A1
  kind: input
  frame: "Wohin {slot} du das?"
  need: {pos: v, tags: [placement]}
  slot: {paradigm: verb_present, person: 2sg}
  why: praesens-2sg

# Прилагательные без степеней сравнения (тег absolute) не брала ни одна рамка:
# из сравнения они исключены, а в рамках с существительным нужен тег generic —
# «die vegetarische Ampel» собиралось бы само. Предикатив их и ждёт, и подлежащее
# здесь «das»: пары прилагательное × существительное тут нет вообще.
# Так эти слова и употребляют в жизни — спрашивают у стойки.
- id: adj-praedikativ-ding
  rule: adj-praedikativ
  level: A1
  kind: choice
  frame: "Ist das {slot}?"
  # «Ist das schwanger?» — поэтому про человека отсюда вон: они в рамке с лицом
  need: {pos: a, tags: [absolute], not: [person]}
  slot: {paradigm: adj_predicative}
  options: {paradigm: adj_predicative, count: 4}
  why: adj-praedikativ

# ── Императив. Пропуск — сама форма, поэтому ввод: вариантов у неё нет.
# Перегласовка в императив не идёт (du fährst, но fahr!), а смена e→i идёт (gib!),
# и это ровно то, на чём ошибаются. Вывод проверяется против UniMorph.
- id: imperativ-du
  rule: imperativ
  level: A1
  kind: input
  frame: "{Slot} das bitte!"
  need: {pos: v, tags: [obj], not: [sep, reflexive, obj_person, placement]}
  slot: {paradigm: imperative}
  why: imperativ

- id: imperativ-solo
  rule: imperativ
  level: A1
  kind: input
  frame: "{Slot} bitte!"
  need: {pos: v, tags: [solo], not: [sep, reflexive]}
  slot: {paradigm: imperative}
  why: imperativ

# ── nicht или kein. Два шаблона на одном инвентаре вариантов: иначе по виду
# вариантов видно, какой ответ нужен. Правило видно только из пары:
# без артикля отрицает kein, с определённым артиклем — nicht.
- id: nicht-kein-ohne
  rule: negation-nicht-kein
  level: A2
  kind: choice
  frame: "Ich finde {slot} {w}."
  need: {pos: n, tags: [thing, document, food, drink, furniture, appliance, vehicle], not: [pl_only, plu, mass]}
  slot: {paradigm: kein_article, case: akk, gender: from_word}
  options: {paradigm: negation, count: 4}
  why: negation-nicht-kein

- id: nicht-kein-mit
  rule: negation-nicht-kein
  level: A2
  kind: choice
  frame: "Ich finde {art} {w} {slot}."
  need: {pos: n, tags: [thing, document, food, drink, furniture, appliance, vehicle], not: [pl_only, plu, mass]}
  slot: {paradigm: nicht, case: akk, gender: from_word}
  options: {paradigm: negation, count: 4}
  why: negation-nicht-kein

