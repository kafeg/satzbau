# ⚠ Обстоятельство вынесено вперёд, поэтому глагол стоит ВТОРЫМ, а подлежащее
# после него. Это единственное место, где порядок слов виден в формате «один пропуск»
- id: futur-bald
  rule: futur
  level: A2
  kind: choice
  frame: "Bald {slot} {subj} {w}."
  need: {pos: v, tags: [solo], not: [reflexive]}
  slot: {paradigm: werden_present, person: from_word}
  options: {paradigm: werden_present, count: 4}
  why: futur

- id: futur-nie
  rule: futur
  level: A2
  kind: choice
  frame: "{Subj} {slot} das nie {w}."
  # ⚠ В рамке есть прямое дополнение «das», значит и глагол нужен переходный: с тегом
  # solo собиралось «Sie werden das nie gehen» — 104 задания из 179. placement исключены
  # по той же причине, что у praesens-er-obj: «das stellen» без «куда» не фраза.
  # sep исключать не надо: {w} это инфинитив, и приставка уезжает в конец вместе с ним.
  need: {pos: v, tags: [obj], not: [reflexive, obj_person, placement]}
  slot: {paradigm: werden_present, person: from_word}
  options: {paradigm: werden_present, count: 4}
  why: futur

