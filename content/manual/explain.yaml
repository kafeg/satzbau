# Объяснения: ОДИН текст на правило, не на задание.
# Это главная ценность приложения, и сгенерировать его нельзя.
#
# Поля:
#   name         короткое имя для списка правил: 2–4 слова, без подстановок
#   group        блок на главной: падеж | артикль | существительное | прилагательное | глагол
#   after        правила, которые разумно знать раньше: задаёт ПОРЯДОК внутри группы.
#                Правило не запирается — это подсказка очереди и списка, а не замок
#   title        заголовок разбора; виден и вне задания, поэтому тоже БЕЗ подстановок
#   short        одна строка для списка ошибок («мои ошибки»)
#   ru_contrast  сопоставление с русским падежом — ядро объяснения
#   steps        шаги разбора; {…} подставляет генератор
#   more         что ещё работает по этому правилу

prep-dativ:
  name: Предлоги + Dativ
  group: падеж
  after: [nominativ-subjekt]
  title: Предлоги, которые всегда требуют Dativ
  short: "{prep} + Dativ"
  ru_contrast: >-
    По-русски «на поезде» — предложный падеж, «с кем, с чем» — творительный.
    Русский тут не помогает: у немецкого mit выбора нет, он всегда требует дательного.
  steps:
    - "предлог {prep} — из списка тех, что всегда с Dativ"
    - "значит падеж: Dativ, без вариантов"
    - "{w} — {gender_ru} род"
    - "{nom_article} → {answer}"
  more: >-
    Всегда с Dativ: aus, bei, mit, nach, seit, von, zu, gegenüber.
    Их восемь, и их стоит выучить списком — тогда половина падежей решается без размышлений.

prep-akkusativ:
  name: Предлоги + Akkusativ
  group: падеж
  after: [akkusativ-objekt]
  title: Предлоги, которые всегда требуют Akkusativ
  short: "{prep} + Akkusativ"
  ru_contrast: >-
    Главная ловушка для русского: «для кого» — родительный падеж, и рука сама тянется
    к немецкому родительному. А für требует винительного: für mich, не für mir.
  steps:
    - "предлог {prep} — из списка тех, что всегда с Akkusativ"
    - "значит падеж: Akkusativ"
    - "{w} — {gender_ru} род"
    - "{nom_article} → {answer}"
  more: >-
    Всегда с Akkusativ: durch, für, gegen, ohne, um, bis, entlang.
    У женского и среднего рода форма не меняется, поэтому ошибка видна только на мужском:
    für einen Mann.

merge-prep-article:
  name: im, ins, zum
  group: артикль
  after: [prep-dativ, prep-akkusativ]
  title: Предлог и артикль сливаются, и падеж пропадает из вида
  # ⚠ Пример берётся из задания: рамки есть и на in, и на zu, а текст «in + dem = im»
  # стоял буквально — на «Ich gehe zum Weg» он говорил про предлог, которого там нет
  short: "{prep} + {plain_article} = {answer}"
  ru_contrast: >-
    В русском предлог и слово никогда не сливаются: «в доме» — два слова.
    В немецком in + dem даёт im, in + das даёт ins. Форма короче, но падеж в ней
    больше не виден — его надо держать в голове.
  steps:
    # у zu падеж задаёт сам предлог, а не вопрос: {prep_why} разводит эти два случая
    - "{prep_why}"
    - "{w} — {gender_ru} род, значит артикль {plain_article}"
    - "{prep} + {plain_article} сливаются в {answer}"
  more: >-
    Сливаются обязательно: im, ins, am, ans, zum, zur, vom, beim.
    Разговорные aufs, fürs, ums сливать не обязательно.
    Проверка на себе: если видишь im — мысленно разверни в in dem, и падеж вернётся.

akkusativ-objekt:
  name: "Akkusativ: прямой объект"
  group: падеж
  after: [nominativ-subjekt]
  title: Прямой объект стоит в Akkusativ
  short: прямой объект → Akkusativ
  ru_contrast: >-
    Падеж тот же, что в русском: прямой объект — винительный. Ловушка в мужском роде.
    По-русски неодушевлённое слово мужского рода в винительном не меняется: «ключ — ищу
    ключ», и кажется, что менять нечего. В немецком мужской род меняется всегда,
    одушевлённый он или нет: der Schlüssel → Ich suche den Schlüssel. Меняется только
    артикль, само слово остаётся.
  steps:
    - "{w} — {gender_ru} род: {nom_article} {w}"
    - "глагол требует прямого объекта, значит падеж Akkusativ"
    - "в Akkusativ это {answer}"
  more: >-
    В Akkusativ меняется только мужской род: der → den, ein → einen. Женский, средний
    и множественное выглядят точно как в именительном — это не упрощение и не ошибка,
    так и есть. Поэтому, увидев das или die, нельзя сказать, какой это падеж: Akkusativ
    спрашивают по падежу, а не наоборот.

nominativ-subjekt:
  name: "Nominativ: подлежащее"
  group: падеж
  title: Nominativ — падеж подлежащего и словарной формы
  short: подлежащее → Nominativ
  ru_contrast: >-
    Здесь языки совпадают: по-русски подлежащее тоже в именительном, и выбирать падеж
    не нужно. Ловушка не в падеже, а в роде. Русский род не подсказывает немецкий:
    «дом» мужского — das Haus среднего, «машина» женского — das Auto среднего.
  steps:
    - "подлежащее стоит в Nominativ"
    - "{w} — {gender_ru} род"
    - "в Nominativ артикль {answer}"
  more: >-
    Nominativ — та форма, в которой слово лежит в словаре. Поэтому артикль учится вместе
    со словом: не «Bahnhof — вокзал», а «der Bahnhof». Все остальные падежи считаются от него,
    и если род не выучен, не поможет никакое правило.

possessiv-nominativ:
  name: mein, meine
  group: артикль
  after: [nominativ-subjekt]
  title: mein склоняется как ein
  short: "mein или meine — по роду слова"
  ru_contrast: >-
    «Мой, моя, моё» меняется по роду и в русском, так что идея знакомая. Отличие одно:
    в мужском и среднем роде немецкое mein не получает вообще никакого окончания —
    mein Kopf, mein Knie. Для русского уха это звучит незаконченно, а это норма.
  steps:
    - "{w} — {gender_ru} род"
    - "в Nominativ у ein-слов: мужской и средний без окончания, женский -e"
    - "{answer} {wform}"
  more: >-
    По той же таблице склоняются ein, kein, dein, sein, ihr, unser — вся группа разом.
    Выучив kein, вы уже знаете mein. Во множественном числе всегда meine: meine Augen.

negation-kein:
  name: kein
  group: артикль
  after: [akkusativ-objekt]
  title: kein — отрицание существительного
  short: нет предмета → kein, а не nicht
  ru_contrast: >-
    По-русски отрицание одно: «у меня нет температуры». В немецком их два, и выбор зависит
    от того, что отрицается. Существительное — kein, всё остальное — nicht:
    «Ich habe kein Fieber», но «Ich komme nicht».
  steps:
    - "отрицается существительное → kein, не nicht"
    - "kein склоняется как ein: {w} — {gender_ru} род, падеж {case_ru}"
    - "{answer} {wform}"
  more: >-
    Разница с ein только во множественном: у ein его нет, а keine Tabletten — обычная фраза.
    И ещё одно: если перед существительным уже стоит der/die/das или притяжательное,
    то отрицание будет nicht, а не kein.

plural-form:
  name: Множественное число
  group: существительное
  after: [nominativ-subjekt]
  title: Множественное число учится вместе со словом
  short: "множественное: {answer}"
  ru_contrast: >-
    По-русски множественное предсказуемо: «стол — столы», «ложка — ложки». В немецком
    пять разных окончаний (-e, -en, -er, -s и никакого) плюс возможная перегласовка,
    и по самому слову выбрать нельзя: der Apfel — die Äpfel, но der Löffel — die Löffel.
  steps:
    - "{lemma_article} {w} — {gender_ru} род"
    - "множественное: {answer}"
    - "во множественном артикль всегда die, род больше не важен"
  more: >-
    Слабые подсказки всё же есть: слова на -e обычно берут -n, на -ung, -heit, -keit —
    всегда -en, многие мужские берут -e и перегласовку. Остальное запоминается парой:
    die Flasche — die Flaschen.

perfekt-partizip:
  name: Partizip II
  group: глагол
  after: [praesens-3sg]
  title: "Partizip II: когда ge-, а когда нет"
  short: "Partizip II: {answer}"
  ru_contrast: >-
    Русское прошедшее — одно слово: «убрал». Немецкое Perfekt — два, и причастие уезжает
    в самый конец фразы. «Ich habe die Wohnung geputzt» звучит для русского уха как
    оборванная фраза, а это нормальный порядок слов.
  steps:
    - "{w} в Perfekt"
    - "{pp_why}"
    - "{answer}"
  more: >-
    Три исключения закрывают почти все случаи. Глаголы на -ieren идут без ge-:
    renoviert, repariert. Неотделяемые приставки be-, ver-, er-, ent- тоже без ge-:
    besichtigt. У отделяемых ge- встаёт внутрь: aufgeräumt, angemeldet.
    А сильные глаголы берут -en вместо -t: gestrichen.

praesens-3sg:
  name: "Präsens: er"
  group: глагол
  title: Третье лицо — -t, а у сильных глаголов ещё и другая гласная
  short: "er → {answer}"
  ru_contrast: >-
    Личные окончания привычны: «я иду, он идёт». Ловушка в другом. У части немецких глаголов
    в третьем лице меняется корневая гласная — как в русском «я еду, он едет», только
    непредсказуемо: fahren → er fährt, essen → er isst, а kaufen → er kauft.
  steps:
    - "{w}, третье лицо единственного числа"
    - "{present_why}"
    - "{answer}"
  more: >-
    Гласную меняют сильные глаголы: a → ä (fahren, schlafen, halten), e → i или ie
    (essen, lesen, sprechen). Только во втором и третьем лице единственного числа:
    ich fahre и wir fahren остаются без перегласовки.

praesens-2sg:
  name: "Präsens: du"
  group: глагол
  after: [praesens-3sg]
  title: Второе лицо — -st, и та же смена гласной
  short: "du → {answer}"
  ru_contrast: >-
    «Ты идёшь» — особое окончание и в русском, так что идея знакома. Разница в том,
    что немецкое окончание -st приходит поверх той же смены гласной, что и в третьем лице:
    er fährt → du fährst.
  steps:
    - "{w}, второе лицо единственного числа"
    - "{present_why}"
    - "{answer}"
  more: >-
    Два подвоха. После s, ß, z, x остаётся только -t: du isst, du heißt. После t или d
    появляется -e-: du arbeitest, du wartest, — но лишь там, где гласная в основе
    не менялась: du hältst, а не «du hältest».

adj-nom-e:
  name: Прилагательное в Nominativ
  group: прилагательное
  after: [adj-praedikativ]
  title: После определённого артикля в Nominativ всегда -e
  short: "Nominativ после der → -e"
  ru_contrast: >-
    По-русски окончание прилагательного зависит от рода: «новый дом, новая квартира,
    новое окно». В немецком после определённого артикля в Nominativ род уже назван
    артиклем — и окончание у всех трёх одно: -e. Повторять род дважды язык не стал.
  steps:
    - "{w} — {gender_ru} род, {nom_article}"
    - "артикль уже показал род, значит склонение слабое"
    - "в Nominativ при нём окончание -e: {article} {w2form}{answer} {wform}"
  more: >-
    Во множественном числе -en: die neuen Wohnungen. И только в Nominativ с Akkusativ
    бывает -e; в Dativ и Genitiv всегда -en, там тоже думать не о чем.

adj-akk-en:
  name: Прилагательное в Akkusativ
  group: прилагательное
  after: [adj-nom-e, akkusativ-objekt]
  title: В Akkusativ меняется только мужской род
  short: "Akkusativ: мужской -en, остальные -e"
  ru_contrast: >-
    Та же ловушка, что и с артиклем: по-русски винительный меняет и женский род
    («новую квартиру»), а в немецком в Akkusativ меняется только мужской.
    Женский и средний выглядят ровно как в Nominativ.
  steps:
    - "{w} — {gender_ru} род, {nom_article}"
    - "Akkusativ: у мужского артикль den и окончание -en, у остальных всё как было"
    - "{article} {w2form}{answer} {wform}"
  more: >-
    Проверка на одном слове: der gute Wein → ich nehme den guten Wein, но
    die gute Suppe → ich nehme die gute Suppe. Если окончание изменилось,
    значит слово мужского рода.

possessiv-akkusativ:
  name: "mein в Akkusativ"
  group: артикль
  after: [possessiv-nominativ, akkusativ-objekt]
  title: В Akkusativ меняется только мужской род
  short: "Akkusativ: meinen у мужского"
  ru_contrast: >-
    По-русски всё наоборот. Женский род в винительном меняется всегда: «моя сумка —
    вижу мою сумку». Мужской — только одушевлённый: «вижу моего брата», но «вижу мой
    ключ». В немецком мужской меняется всегда — meinen Schlüssel, meinen Bruder, —
    а женский и средний не меняются: meine Tasche, mein Auto.
  steps:
    - "{w} — {gender_ru} род"
    - "Akkusativ: мужской получает -en, остальные остаются как были"
    - "{answer} {wform}"
  more: >-
    Это общее правило всей группы ein-слов: ein → einen, kein → keinen, mein → meinen,
    и только в мужском роде. Выучив его один раз, вы закрыли и артикль, и отрицание,
    и все притяжательные.

komparativ:
  name: Степени сравнения
  group: прилагательное
  after: [adj-praedikativ]
  title: Сравнительная на -er, превосходная на -sten
  short: "{w} → {answer}"
  ru_contrast: >-
    По-русски сравнительная бывает и словом, и оборотом: «теплее» или «более тёплый».
    В немецком оборота нет совсем: только -er, даже у длинных слов —
    interessanter, а не «mehr interessant». Это одна из частых ошибок именно у русских.
  steps:
    - "{w}, {degree_ru} степень"
    - "короткие слова с a, o, u часто получают умлаут: {degree_example}"
    - "{answer}"
  more: >-
    Превосходная: am …-sten, после t, d, s, ß, z и sch вставляется -e-: am ältesten.
    ⚠ Ловушка: сравнительная выбрасывает -e- в основе (teuer → teurer, dunkel → dunkler),
    а превосходная нет — am teuersten, am dunkelsten. Неправильные три:
    gut → besser → am besten, viel → mehr → am meisten, gern → lieber → am liebsten.

dativ-objekt:
  name: Глаголы с Dativ
  group: падеж
  after: [prep-dativ]
  title: Эти глаголы требуют Dativ без всякого предлога
  short: helfen, antworten + Dativ
  ru_contrast: >-
    Тут русский помогает: «помогать кому» — дательный, и в немецком тоже Dativ.
    Ловушка в другом: по-русски «я спрашиваю его» — винительный, а немецкое antworten
    требует дательного. Падеж задаёт сам глагол, и список приходится знать.
  steps:
    - "глагол требует Dativ сам, предлога нет"
    - "{w} — {gender_ru} род"
    - "{nom_article} → {answer}"
  more: >-
    Частые глаголы с Dativ: helfen, antworten, danken, gehören, gefallen, passen,
    schmecken, folgen. Их немного, и они стоят того, чтобы выучить списком —
    иначе каждый раз придётся гадать.

genitiv-besitz:
  name: Genitiv принадлежности
  group: падеж
  after: [dativ-objekt]
  title: Чей — это Genitiv, и он стоит после
  short: "чей? → {answer} {wform}"
  ru_contrast: >-
    По-русски «машина отца» — родительный, и порядок тот же: сначала машина, потом отец.
    В немецком так же, но добавляется окончание у самого слова: des Vaters, не «des Vater».
    У мужского и среднего это -s или -es, у женского ничего.
  steps:
    - "вопрос «чей» → Genitiv"
    - "{w} — {gender_ru} род"
    - "{nom_article} → {answer}, {gen_ending_why}"
  more: >-
    В разговоре Genitiv часто заменяют на von + Dativ: das Auto von meinem Vater.
    В письменном языке так лучше не делать, но услышите вы именно это.

praeteritum:
  name: Präteritum
  group: глагол
  after: [perfekt-partizip]
  title: Второе прошедшее время — для письма и рассказа
  short: "{w} → {answer}"
  ru_contrast: >-
    По-русски прошедшее одно: «работал», «пошёл». В немецком их два, и разница
    не в смысле, а в том, где они употребляются: в разговоре Perfekt, на письме
    и в рассказах Präteritum. Переводятся оба одинаково.
  steps:
    - "{w} в Präteritum"
    - "слабые глаголы получают -te: wohnen → wohnte"
    - "{answer}"
  more: >-
    Сильные меняют гласную и не берут -te: gehen → ging, essen → aß, fahren → fuhr.
    Их приходится учить списком, как и Partizip II. В устной речи Präteritum
    употребляют почти только у sein, haben и модальных: war, hatte, musste, konnte.

adj-ohne-artikel:
  name: Прилагательное без артикля
  group: прилагательное
  after: [adj-gemischt]
  title: Нет артикля — окончание берёт на себя прилагательное
  short: "без артикля → окончание артикля"
  ru_contrast: >-
    Для русского это самое непривычное место во всей теме. По-русски окончание
    прилагательного не зависит от того, стоит ли перед ним слово. В немецком зависит:
    если артикля нет, род показать больше нечем — и это делает прилагательное,
    забирая окончание артикля себе.
  steps:
    - "{w} — {gender_ru} род, артикля перед ним нет"
    - "значит окончание показывает род само: как у артикля, но у прилагательного"
    - "gut{answer} {wform}"
  more: >-
    Сравните три случая с одним словом: der frische Fisch (артикль есть — прилагательное
    отдыхает, -e), ein frischer Fisch (артикль рода не показывает — прилагательное
    помогает), frischer Fisch (артикля нет — всё на прилагательном). Без артикля
    существительные стоят, когда говорят о веществе или о чём-то вообще.

modalverben:
  name: Модальные глаголы
  group: глагол
  after: [praesens-3sg]
  title: Модальный спрягается по-своему, смысловой уходит в конец
  short: "{modal_hint}"
  ru_contrast: >-
    По-русски «могу, можешь, может» — окончания меняются у всех лиц одинаково привычно.
    В немецком модальные ведут себя особо: в единственном числе первое и третье лицо
    совпадают и оба БЕЗ окончания — ich kann, er kann. Рука по привычке дописывает -t,
    и это самая частая ошибка с ними.
  steps:
    - "модальный глагол, {person_ru}"
    - "в единственном числе первое и третье лицо совпадают и окончания не имеют, во множественном глагол обычный"
    - "{answer}, а смысловой глагол уходит в конец в инфинитиве"
  more: >-
    Все шесть: können, müssen, wollen, dürfen, sollen, mögen. Во множественном они
    обычные: wir können, ihr könnt. И гласная в единственном меняется: müssen → ich muss,
    dürfen → ich darf, mögen → ich mag. Смысловой глагол всегда в конце
    и всегда в инфинитиве — это и есть рамка предложения.

adj-plural:
  name: Прилагательное во множественном
  group: прилагательное
  after: [adj-nom-e, plural-form]
  title: Во множественном после артикля всегда -en
  short: "множественное после die → -en"
  ru_contrast: >-
    По-русски во множественном окончание одно на все роды: «новые дома, новые квартиры».
    В немецком после артикля точно так же — одно окончание -en на всё. Это тот редкий
    случай, когда немецкий проще, и запоминать нечего.
  steps:
    - "множественное число, перед прилагательным артикль die"
    - "род во множественном не различается"
    - "окончание -en: die gut{answer} {wform}"
  more: >-
    Без артикля во множественном окончание -e: gute Freunde. А в Dativ множественного
    -en в любом случае: mit den guten Freunden, mit guten Freunden.

adj-praedikativ:
  name: Прилагательное после ist
  group: прилагательное
  after: [nominativ-subjekt]
  title: После ist прилагательное не меняется вообще
  short: "после ist — без окончания"
  ru_contrast: >-
    По-русски «отец уставший» — окончание есть, и рука тянется дописать его и в немецком.
    А после ist, wird и bleibt прилагательное стоит голым: der Vater ist müde, не «müder».
    Правило простое, но ошибка держится долго именно из-за русской привычки.
  steps:
    - "прилагательное стоит после ist, а не перед существительным"
    - "значит оно не склоняется: ни рода, ни падежа"
    - "{answer}"
  more: >-
    Склоняется прилагательное только перед существительным: der müde Vater. После
    глаголов sein, werden, bleiben — всегда голая форма. Сравните: Das Essen ist gut,
    но Das ist gutes Essen.

pronomen-akkusativ:
  name: "Он, она, оно про вещи"
  group: артикль
  after: [akkusativ-objekt]
  title: Местоимение берёт род предмета, а не одушевлённость
  short: "{nom_article} {w} → {answer}"
  ru_contrast: >-
    Главная ловушка для русского. По-русски вещь почти всегда «он» или «она» по роду,
    но в сомнении говорят «оно». В немецком сомнения быть не может: род у слова уже есть,
    и местоимение просто его повторяет. Der Tisch → ihn, die Tür → sie, das Fenster → es.
    Сказать es про стол — та же ошибка, что сказать «das Tisch».
  steps:
    - "{w} — {gender_ru} род, {nom_article}"
    - "местоимение берёт тот же род"
    - "в Akkusativ: {answer}"
  more: >-
    Полная тройка в Akkusativ: ihn, sie, es; во множественном sie. В Dativ:
    ihm, ihr, ihm, ihnen. Заметьте, что sie и ihr совпадают с другими словами —
    различать их помогает только падеж и место во фразе.

imperativ:
  name: Повелительное наклонение
  group: глагол
  after: [praesens-2sg]
  title: Приказ и просьба — глагол без подлежащего
  short: "{w} → {answer}"
  ru_contrast: >-
    По-русски «сделай» — своя форма, и в немецком тоже своя, но делается она иначе:
    не от инфинитива, а от основы, и подлежащее при ней не говорят. «Du mach das!»
    звучит как окрик, нормальная просьба — «Mach das bitte!». Главная ловушка в том,
    что перегласовка сюда НЕ идёт: du fährst, но fahr!, du läufst, но lauf!
  steps:
    - "{w} в повелительном — {answer}"
    - "подлежащего нет: du в просьбе не называют"
    - "{imp_why}"
  more: >-
    Три вещи сразу. Смена гласной e→i остаётся: geben → gib, nehmen → nimm,
    lesen → lies, essen → iss, sprechen → sprich. Перегласовка a→ä исчезает:
    fahren → fahr, laufen → lauf, halten → halt. Беглая -e появляется там же, где
    и в настоящем времени: arbeiten → arbeite, öffnen → öffne, atmen → atme.
    У отделяемого глагола приставка уезжает в конец: Füll das bitte aus!

negation-nicht-kein:
  name: nicht или kein
  group: артикль
  after: [negation-kein]
  title: Отрицаем предмет или всё действие
  short: "{answer}"
  ru_contrast: >-
    По-русски отрицание одно — «не»: «я не покупаю машину» и «я не покупаю ЭТУ
    машину» различаются только ударением. В немецком это два разных слова, и выбирает
    их не смысл, а то, стоит ли перед существительным определённый артикль:
    Ich kaufe kein Auto, но Ich kaufe das Auto nicht.
  steps:
    - "отрицаем {w}"
    - "перед словом нет артикля — значит kein, и он склоняется как ein"
    - "артикль определённый или это притяжательное — значит nicht, и оно встаёт в конец"
    - "здесь это {answer}"
  more: >-
    Правило держится на артикле, а не на смысле. kein заменяет собой ein и пустое
    место перед словом, поэтому «ein Auto» → «kein Auto», а «Autos» → «keine Autos».
    nicht ничего не заменяет, а добавляется, и потому встаёт в конец фразы —
    перед вторым глаголом, если он есть: Ich kann das Auto nicht kaufen.

pronomen-dativ:
  name: ihm или ihr
  group: артикль
  after: [pronomen-akkusativ, dativ-objekt]
  title: Местоимение в Dativ — ihm, ihr, ihnen
  short: "{w} → {answer}"
  ru_contrast: >-
    По-русски «помогаю ему» и «вижу его» — две разные формы одного местоимения,
    и это привычно. В немецком так же: ihn это Akkusativ, ihm это Dativ. Беда в том,
    что падеж задаёт глагол, а не смысл: helfen, danken, gehören требуют Dativ,
    хотя по-русски там винительный или вовсе без предлога.
  steps:
    - "{w} — {gender_ru} род, в именительном {nom_article}"
    - "глагол требует Dativ, а не Akkusativ"
    - "{gender_ru} род в Dativ даёт {answer}"
  more: >-
    Таблица короткая: er → ihm, sie → ihr, es → ihm, sie (мн.) → ihnen. Женский род
    единственного и множественное число звучат одинаково в именительном (sie), но
    в Dativ расходятся: ihr и ihnen. Множественное в Dativ ещё и даёт существительному
    -n: mit den Kindern.

possessiv-dativ:
  name: mein в Dativ
  group: артикль
  after: [possessiv-akkusativ, prep-dativ]
  title: Мой, моя, моё после предлога с Dativ
  short: "{answer} {wform}"
  ru_contrast: >-
    По-русски «с моим братом» и «с моей сестрой» — окончание меняется по роду, и это
    знакомо. В немецком то же, но окончаний больше и они совпадают с окончаниями ein:
    meinem, meiner, meinem, meinen. Предлог mit всегда требует Dativ, какой бы смысл
    ни был, — это не «куда» и не «где», это свойство предлога.
  steps:
    - "{w} — {gender_ru} род, в именительном {nom_article}"
    - "{dativ_why}"
    - "{gender_ru} род в Dativ даёт {answer}"
  more: >-
    mein склоняется как ein, и это общее правило для dein, sein, ihr, unser и kein.
    В Dativ: мужской и средний — meinem, женский — meiner, множественное — meinen.
    Мужской и средний совпадают, и это та экономия, которой в именительном нет.

n-deklination:
  name: n-склонение
  group: существительное
  after: [akkusativ-objekt]
  title: der Nachbar, но den Nachbarn
  short: "{nom_article} {w} → {answer}"
  ru_contrast: >-
    По-русски существительное меняет окончание в каждом падеже, и это норма.
    В немецком обычное слово не меняется вовсе — склоняется артикль. Но есть группа
    мужских слов, которые ведут себя по-русски: во всех падежах кроме именительного
    получают -n или -en. Их мало, и их проще запомнить списком, чем правилом.
  steps:
    - "{w} — слово n-склонения"
    - "{case_ru}: к слову прибавляется -n"
    - "получается {answer}"
  more: >-
    Сюда попадают почти все мужские слова на -e (Junge, Kollege, Kunde, Name),
    слова на -ant, -ent, -ist, -at (Patient, Automat, Polizist) и отдельные
    вроде Nachbar, Herr, Mensch, Bauer. Женских и средних в этой группе нет.
    Именительный падеж остаётся без -n, и этим группа и опознаётся.

man-subjekt:
  name: Безличное man
  group: глагол
  after: [praesens-3sg]
  title: man — «люди вообще», и глагол при нём как при er
  short: "man {answer}"
  ru_contrast: >-
    По-русски безличность делается множественным числом без подлежащего: «здесь
    хорошо готовят», «тут не курят». В немецком подлежащее обязательно, и его место
    занимает man. Ошибка почти у всех: man выглядит как «люди», и рука ставит
    множественное — «man arbeiten». А man это единственное число, и глагол при нём
    ровно такой же, как при er.
  steps:
    - "man — единственное число, не множественное"
    - "{w} при нём стоит как при er"
    - "получается {answer}"
  more: >-
    man употребляют там, где по-русски сказали бы «обычно так делают»: Hier spricht
    man Deutsch. У него нет множественного числа и нет формы для «кем»: вместо
    «von man» говорят иначе. В Akkusativ и Dativ он превращается в einen и einem —
    это единственные его падежные формы.

es-gibt:
  name: es gibt
  group: падеж
  after: [akkusativ-objekt]
  title: После es gibt всегда Akkusativ
  short: "es gibt {answer} {wform}"
  ru_contrast: >-
    По-русски «здесь есть парк» — подлежащее, именительный падеж. В немецком то же
    самое говорят оборотом es gibt, и после него стоит ПРЯМОЙ ОБЪЕКТ, то есть
    Akkusativ: es gibt einen Park, а не «ein Park». Смысл спорит с падежом, и рука
    ставит именительный почти всегда.
  steps:
    - "es gibt требует Akkusativ, хотя по смыслу тут «есть»"
    - "{w} — {gender_ru} род"
    - "{gender_ru} род в Akkusativ даёт {answer}"
  more: >-
    Оборот неизменяемый: всегда es gibt, независимо от числа. «Hier gibt es einen
    Park» и «Hier gibt es zwei Parks» — gibt в обоих. Изменить можно только время:
    es gab (было), es wird … geben (будет). Разница с ist в том, что es gibt говорит
    о наличии вообще, а ist — о месте: «Der Park ist dort».

prep-genitiv:
  name: Предлоги + Genitiv
  group: падеж
  after: [genitiv-besitz]
  title: wegen и während требуют Genitiv
  short: "{answer} {wform}"
  ru_contrast: >-
    По-русски «из-за забастовки» — родительный падеж, и это совпадает: немецкие wegen,
    während и trotz тоже берут Genitiv. Совпадение редкое и приятное, но есть ловушка:
    в разговоре немцы сплошь и рядом говорят «wegen dem Streik» с Dativ, и это
    считается просторечием. В письме и на экзамене нужен Genitiv.
  steps:
    - "{w} — {gender_ru} род"
    - "wegen и während требуют Genitiv"
    - "{gender_ru} род в Genitiv даёт {answer}"
  more: >-
    Genitiv у артикля простой: des для мужского и среднего, der для женского и
    множественного. Существительное мужского и среднего рода при этом получает
    -s или -es: des Streiks, des Kindes. Женский и множественное не меняются.
    Таких предлогов немного: wegen, während, trotz, statt, außerhalb.

adj-gemischt:
  name: Прилагательное после ein
  group: прилагательное
  after: [adj-nom-e]
  title: После ein окончание показывает род, после der — нет
  short: "{ein} {w2form}{answer} {wform}"
  ru_contrast: >-
    По-русски окончание прилагательного работает всегда одинаково: «новый дом», «новая
    квартира», «новое окно» — род виден в любом случае. В немецком это зависит от того,
    что стоит перед прилагательным. После der род уже назван артиклем, и прилагательное
    обходится одним -e на все три рода. После ein артикль рода НЕ показывает (ein дом и
    ein окно звучат одинаково), и показать его обязано прилагательное: ein neuER Tisch,
    ein neuES Fenster.
  steps:
    - "{w} — {gender_ru} род, в именительном {nom_article}"
    - "после ein артикль род не показывает, значит показывает прилагательное"
    - "{gender_ru} род, {case_ru} — окончание {answer}"
  more: >-
    Это и называется смешанным склонением: там, где артикль род назвал, прилагательное
    берёт слабое окончание, а там, где не назвал, — сильное. Различаются всего три
    клетки: мужской Nominativ (-er), средний Nominativ и Akkusativ (-es). Остальное
    совпадает со слабым и равно -en или -e. Та же таблица работает после kein и
    после mein, dein, sein — это одна группа ein-слов.

genus:
  name: der, die или das
  group: существительное
  after: [nominativ-subjekt]
  # ⚠ lex: правило учится вместе со словом. Расписание повторов идёт по карточке СЛОВА,
  # а не по карточке правила: род либо знаешь у этого слова, либо нет, и «выучить род»
  # как правило нельзя. Карточка правила тут значит только «встречалось».
  lex: true
  title: Род учится вместе со словом
  short: "{answer} {w}"
  ru_contrast: >-
    В русском род почти всегда слышен в окончании: «стол» мужской, «книга» женская,
    «окно» среднее. В немецком окончание подсказывает реже, а русский род совпадает
    с немецким через раз: der Tisch и «стол», das Fenster и «окно» — да, но das Mädchen
    против «девочки», der Löffel против «ложки», das Auto против «машины». Совпадение
    случайно, поэтому переносить род из русского нельзя.
  steps:
    - "{w} — {gender_ru} род"
    - "значит {answer}"
    - "{genus_why}"
  more: >-
    Надёжных подсказок немного, но они закрывают много слов. Женский: -ung, -heit, -keit,
    -schaft, -tion, -tät (die Wohnung, die Rechnung, die Station). Средний: уменьшительные
    на -chen и -lein, что бы слово ни значило — поэтому das Mädchen (но der Kuchen —
    не уменьшительное). Почти всегда женский: -ei, -ie, -ik, но das Ei, der Streik.
    Мужской: деятель на -er
    (der Fahrer, der Lehrer), дни, месяцы и времена года. Всё остальное учится со словом,
    и именно поэтому артикль стоит в карточке слова рядом с переводом.
