# Публикация на GitHub Pages из Actions, не из ветки: dist в репозиторий не коммитим.
# ⚠ В настройках репозитория Pages → Source должен стоять «GitHub Actions».
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Валидатор данных: словарь тегов, подстановки в заголовках, наполнение шаблонов.
      # Он читает только content/, поэтому хватает pyyaml без остальных инструментов.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'PyYAML>=6'
      - run: python -I tools/check_data.py
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
