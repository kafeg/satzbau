# Род существительного: признаки, которые его предсказывают (docs/rules.md).
# Доля и исключения не пишутся руками: их считают tools/import_rules.py и verify.py.
# Каждое правило — минимум два источника; в каждом источнике — раздел (at) и строка (find).

- id: suffix-ung
  when: {suffix: ung}
  gender: f
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "''-ung,''"}
    - {src: de-wp-genus, at: Deklinationsklasse, find: "''-ung''<sup>''(f)''</sup>"}
    - {src: en-wb-gender, at: Suffixes, find: "suffix ''-ung'' are feminine"}

- id: suffix-heit
  when: {suffix: heit}
  gender: f
  sources:
