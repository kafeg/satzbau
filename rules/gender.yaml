# Род существительного: признаки, которые его предсказывают (docs/rules.md).
# Доля и исключения не пишутся руками: их считают tools/import_rules.py и verify.py.
# Каждое правило — минимум два источника; в каждом источнике — раздел (at) и строка (find).
# then — что правило утверждает о поле слова; head — «как у последней части сложного слова».

- id: suffix-ung
  when: {suffix: ung}
  then: {gender: f}
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "''-ung,''"}
    - {src: de-wp-genus, at: Deklinationsklasse, find: "''-ung''<sup>''(f)''</sup>"}
    - {src: en-wb-gender, at: Suffixes, find: "suffix ''-ung'' are feminine"}

- id: suffix-heit
  when: {suffix: heit}
  then: {gender: f}
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "-heit,"}
    - {src: de-wp-genus, at: Deklinationsklasse, find: "''-heit''<sup>''(f)''</sup>"}
    - {src: en-wb-gender, at: Suffixes, find: "''-heit/keit''"}

- id: suffix-keit
  when: {suffix: keit}
  then: {gender: f}
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "-keit,"}
    - {src: de-wp-genus, at: Deklinationsklasse, find: "''-keit''<sup>''(f)''</sup>"}
    - {src: en-wb-gender, at: Suffixes, find: "''-heit/keit''"}

- id: suffix-schaft
  when: {suffix: schaft}
  then: {gender: f}
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "-schaft,"}
    - {src: de-wp-genus, at: Deklinationsklasse, find: "''-schaft''<sup>''(f)''</sup>"}

- id: suffix-in
  when: {suffix: in}
  then: {gender: f}
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "''-in,''"}
    - {src: de-wp-genus, at: Deklinationsklasse, find: "''-in''<sup>''(f)''</sup>"}
    - {src: en-wb-gender, at: Suffixes, find: "suffix ''-in''"}

- id: suffix-ei
  when: {suffix: ei}
  then: {gender: f}
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "''-a, -ei,"}
    - {src: de-wp-genus, at: Genus von Objekten ohne natürliches Geschlecht, find: "auf ''-ung'' und auf ''-ei''"}

- id: ending-e
  when: {suffix: e}
  then: {gender: f}
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "90% of nouns in ''-e''"}
    - {src: en-wb-gender, at: The -e ending, find: "Most nouns ending in ''-e'' are feminine"}

- id: suffix-tum
  when: {suffix: tum}
  then: {gender: n}
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "-tum, -um"}
    - {src: de-wp-genus, at: Deklinationsklasse, find: "''-tum''<sup>''(n''"}

- id: suffix-chen
  when: {suffix: chen}
  then: {gender: n}
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "''-chen,''"}
    - {src: de-wp-genus, at: Deklinationsklasse, find: "''-chen''<sup>''(n)''</sup>"}
    - {src: en-wb-gender, at: Suffixes, find: "Diminutive suffixes are neuter"}

- id: suffix-lein
  when: {suffix: lein}
  then: {gender: n}
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "''-lein,''"}
    - {src: de-wp-genus, at: Deklinationsklasse, find: "''-lein''<sup>''(n)''</sup>"}
    - {src: en-wb-gender, at: Suffixes, find: "''-lein''"}

- id: suffix-ling
  when: {suffix: ling}
  then: {gender: m}
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "-ling, -or"}
    - {src: de-wp-genus, at: Deklinationsklasse, find: "''-ling''<sup>''(m)''</sup>"}

- id: ending-er
  when: {suffix: er}
  then: {gender: m}
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "60% of nouns in -''el'' and ''-er''"}
    - {src: en-wb-gender, at: Suffixes, find: "The suffix ''-er'', masculine"}

- id: ending-o
  when: {suffix: o}
  then: {gender: n}
  sources:
    - {src: en-wp-gender, at: Noun forms, find: "''-o'' and ''-on''"}
    - {src: en-wb-gender, at: The -o ending and imported words, find: "tend to be neuter"}

- id: compound
  when: {head: true}
  then: {gender: head}
  sources:
    - {src: en-wp-gender, at: Compounds and abbreviations, find: "Compound words usually carry the gender of their last element"}
    - {src: en-wb-gender, at: Compounds, find: "the gender matches the gender of the second word"}

- id: seasons-months
  when: {list: [Frühling, Sommer, Herbst, Winter, Januar, Februar, März, April, Mai, Juni, Juli, August, September, Oktober, November, Dezember]}
  then: {gender: m}
  title: времена года и месяцы
  sources:
    - {src: en-wp-gender, at: Noun meanings, find: "Seasons, months and days of the week"}
    - {src: de-wp-genus, at: Genus von Objekten ohne natürliches Geschlecht, find: "alle Jahreszeiten und Monatsnamen maskulin"}

# списки групп — слова базы, у которых в dewikt родовое понятие (Oberbegriff) — эта группа:
# Wochentag, Himmelsrichtung, алкогольный напиток (Alkohol — Getränk, и он в примерах en-wb-nouns);
# без слов, у которых в базе другое значение (Abend, Morgen — сторона света; Wasser, Sturm — напиток)
- id: weekdays
  when: {list: [Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonnabend, Sonntag]}
  then: {gender: m}
  title: дни недели
  sources:
    - {src: en-wp-gender, at: Noun meanings, find: "Seasons, months and days of the week"}
    - {src: de-wp-genus, at: Genus von Objekten ohne natürliches Geschlecht, find: "Maskulin sind heute alle Wochentage"}
    - {src: en-wb-nouns, at: Semantic Groups Which Are Masculine, find: "z.B. der Montag"}

- id: compass
  when: {list: [Norden, Osten, Süden, Westen, Nordosten, Nordwesten, Südosten, Südwesten]}
  then: {gender: m}
  title: стороны света
  sources:
    - {src: en-wp-gender, at: Noun meanings, find: "Compass points, words about winds and types of weather."}
    - {src: en-wb-nouns, at: Semantic Groups Which Are Masculine, find: "compass points: Norden, Osten, Süden, Westen, Nordwesten"}

# das Bier — в списке: источники называют его исключением, доля его учитывает
- id: alcohol
  when: {list: [Wein, Sekt, Alkohol, Bier]}
  then: {gender: m}
  title: алкогольные напитки
  sources:
    - {src: en-wp-gender, at: Noun meanings, find: "Alcoholic and plant-based drinks. || but: ''das Bier''"}
    - {src: en-wb-nouns, at: Semantic Groups Which Are Masculine, find: "z.B. der Wein, der Likör, der Alkohol, der Champagner"}
